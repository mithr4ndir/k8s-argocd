kube-prometheus-stack:
  # Prometheus configuration
  prometheus:
    prometheusSpec:
      retention: 15d
      additionalScrapeConfigs:
        - job_name: 'proxmox'
          metrics_path: /pve
          params:
            module: [default]
            cluster: ['1']
            node: ['1']
            target: ['localhost']
          static_configs:
            - targets:
              - '192.168.1.10:9221'
              - '192.168.1.11:9221'
        - job_name: 'vm-node-exporter'
          relabel_configs:
            - source_labels: [__address__]
              target_label: target_address
          file_sd_configs:
            - files:
                - /etc/prometheus/file_sd/vm-targets.json
              refresh_interval: 1m
        - job_name: 'snmp-switch'
          metrics_path: /snmp
          params:
            module: [if_mib]
            auth: [switch_v2c]
          static_configs:
            - targets:
                - '192.168.1.2'
              labels:
                instance: 'lab-sw01'
                device_type: 'switch'
                vendor: 'tplink'
                model: 'TL-SG2016P'
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: snmp-exporter-prometheus-snmp-exporter.monitoring.svc.cluster.local:9116
      volumes:
        - name: file-sd-targets
          configMap:
            name: prometheus-file-sd-targets
      volumeMounts:
        - name: file-sd-targets
          mountPath: /etc/prometheus/file_sd
          readOnly: true
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: k8s-nfs
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      externalLabels:
        cluster: quasarlab-k8s
      # Resource limits
      resources:
        requests:
          memory: 400Mi
          cpu: 200m
        limits:
          memory: 2Gi
          cpu: 1000m

  grafana:
    enabled: true
    image:
      tag: "12.4.1"

    # Server configuration
    grafana.ini:
      server:
        domain: graphy.herro.me
        root_url: https://graphy.herro.me
      database:
        type: postgres
        host: 192.168.1.123:5432
        name: grafana
        user: grafana
        ssl_mode: disable

    # PostgreSQL password from ExternalSecret
    envFromSecret: grafana-secrets

    # Auto-restart Grafana when the grafana-secrets Secret changes
    # (e.g. after a 1Password rotation + ESO re-sync). Without this,
    # Grafana keeps running with stale env vars until manual restart.
    podAnnotations:
      reloader.stakater.com/auto: "true"

    # Plugins
    plugins:
      - grafana-opensearch-datasource
      - marcusolsson-calendar-panel
      - neocat-cal-heatmap-panel

    # Datasources provisioned via sidecar
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
        jsonData:
          maxLines: 1000
      - name: Wazuh-OpenSearch
        type: grafana-opensearch-datasource
        access: proxy
        url: https://192.168.1.171:9200
        isDefault: false
        jsonData:
          database: "wazuh-alerts-*"
          flavor: opensearch
          version: "2.18.0"
          pplEnabled: true
          timeField: "timestamp"
          tlsSkipVerify: true
        secureJsonData:
          basicAuthPassword: $__env{WAZUH_OPENSEARCH_PASSWORD}
        basicAuth: true
        basicAuthUser: admin

    # Dashboard sidecar
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: false
          allowUiUpdates: true

    # No persistent volume — PostgreSQL is the backend
    persistence:
      enabled: false

    # Service — reuse the old Grafana VM IP via MetalLB
    service:
      type: LoadBalancer

    # Resource limits
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

  # Alertmanager configuration
  # Config secret is managed by ExternalSecret (alertmanager-external-secret.yaml)
  # pulling the Discord webhook URL from 1Password.
  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 2
      configSecret: alertmanager-custom-config
      secrets:
        - healthchecks-watchdog
      podAntiAffinity: "soft"
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: k8s-nfs
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
      resources:
        requests:
          memory: 50Mi
          cpu: 10m
        limits:
          memory: 100Mi
          cpu: 100m

  # Node exporter disabled - already deployed via Ansible on k8s nodes
  nodeExporter:
    enabled: false

  # Kube state metrics for Kubernetes object metrics
  kubeStateMetrics:
    enabled: true

  # Scrape kubelet metrics
  kubelet:
    enabled: true

  # Disable scraping/rules for components that bind to 127.0.0.1 on kubeadm
  # and aren't reachable by default ServiceMonitors
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  # Custom alerting rules for hypervisors and VMs
  additionalPrometheusRulesMap:
    vm-node-alerts:
      groups:
        - name: node-availability
          rules:
            - alert: NodeDown
              expr: up{job="vm-node-exporter"} == 0
              for: 3m
              labels:
                severity: critical
              annotations:
                summary: "{{ $labels.instance }} is down"
                description: "Node exporter on {{ $labels.instance }} has been unreachable for 3 minutes."
        - name: node-resources
          rules:
            - alert: HighCpuUsage
              expr: (1 - avg by(instance) (rate(node_cpu_seconds_total{job="vm-node-exporter", mode="idle"}[5m]))) * 100 > 90
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} CPU > 90%"
                description: "{{ $labels.instance }} CPU usage has been above 90% for 10 minutes (current: {{ $value | printf \"%.1f\" }}%)."
            - alert: HighMemoryUsage
              expr: (1 - node_memory_MemAvailable_bytes{job="vm-node-exporter", instance!="truenas"} / node_memory_MemTotal_bytes{job="vm-node-exporter", instance!="truenas"}) * 100 > 90
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} memory > 90%"
                description: "{{ $labels.instance }} memory usage has been above 90% for 10 minutes (current: {{ $value | printf \"%.1f\" }}%)."
            - alert: TrueNasLowMemory
              expr: node_memory_MemAvailable_bytes{job="vm-node-exporter", instance="truenas"} < 2 * 1024 * 1024 * 1024
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "TrueNAS available memory < 2GB"
                description: "TrueNAS has only {{ $value | humanize1024 }}B available. ZFS ARC may not be releasing memory fast enough."
            - alert: DiskSpaceLow
              expr: (1 - node_filesystem_avail_bytes{job="vm-node-exporter", fstype=~"ext4|xfs|zfs", mountpoint!~"/boot.*"} / node_filesystem_size_bytes{job="vm-node-exporter", fstype=~"ext4|xfs|zfs", mountpoint!~"/boot.*"}) * 100 > 85
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} disk > 85% on {{ $labels.mountpoint }}"
                description: "{{ $labels.instance }} filesystem {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full."
            - alert: DiskSpaceCritical
              expr: (1 - node_filesystem_avail_bytes{job="vm-node-exporter", fstype=~"ext4|xfs|zfs", mountpoint!~"/boot.*"} / node_filesystem_size_bytes{job="vm-node-exporter", fstype=~"ext4|xfs|zfs", mountpoint!~"/boot.*"}) * 100 > 95
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "{{ $labels.instance }} disk > 95% on {{ $labels.mountpoint }}"
                description: "{{ $labels.instance }} filesystem {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full. Immediate action required."
            # Adds lead time ahead of the static DiskSpace* thresholds, which
            # work correctly but can only react once the disk is already nearly
            # full. On 2026-08-24 jellyfin's / went 33% -> 98% in 90 minutes as
            # seven concurrent transcodes wrote whole-title HLS output.
            # DiskSpaceLow behaved exactly as configured -- pending at 03:15:00
            # on the 85% crossing, firing at 03:25:00 -- but that left roughly
            # eight minutes before the filesystem would have been full. This
            # projects the trend instead of waiting for a level: replayed
            # against the same incident it is satisfied from 02:28, so with
            # for:10m it fires around 02:38, about 47 minutes earlier. Replayed
            # fleet-wide over the preceding 7 days it matches nothing else.
            - alert: DiskFillingFast
              expr: |-
                (
                  predict_linear(node_filesystem_avail_bytes{job="vm-node-exporter", fstype=~"ext4|xfs|zfs", mountpoint!~"/boot.*"}[30m], 2 * 3600) < 0
                )
                and on(instance, mountpoint) (
                  node_filesystem_avail_bytes{job="vm-node-exporter", fstype=~"ext4|xfs|zfs", mountpoint!~"/boot.*"}
                  / node_filesystem_size_bytes{job="vm-node-exporter", fstype=~"ext4|xfs|zfs", mountpoint!~"/boot.*"}
                  < 0.50
                )
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is filling fast"
                description: "{{ $labels.instance }} filesystem {{ $labels.mountpoint }} is on track to run out of space within 2 hours at the current rate. Check the transcode cache and journald before it wedges anything writing to that disk."
            - alert: HighSystemLoad
              expr: node_load15{job="vm-node-exporter"} / count without(cpu) (count without(mode) (node_cpu_seconds_total{job="vm-node-exporter", mode="idle"})) > 2
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} load average is high"
                description: "{{ $labels.instance }} 15m load average is {{ $value | printf \"%.1f\" }}x the CPU count."
        - name: node-hardware
          rules:
            - alert: NetworkErrors
              expr: rate(node_network_receive_errs_total{job="vm-node-exporter", device!~"veth.*|cali.*|tunl.*"}[5m]) + rate(node_network_transmit_errs_total{job="vm-node-exporter", device!~"veth.*|cali.*|tunl.*"}[5m]) > 5
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} network errors on {{ $labels.device }}"
                description: "{{ $labels.instance }} interface {{ $labels.device }} is seeing network errors ({{ $value | printf \"%.1f\" }}/s)."
            - alert: OOMKillDetected
              expr: increase(node_vmstat_oom_kill{job="vm-node-exporter"}[5m]) > 0
              labels:
                severity: warning
              annotations:
                summary: "OOM kill on {{ $labels.instance }}"
                description: "{{ $labels.instance }} had an OOM kill in the last 5 minutes."
    nfs-and-prometheus:
      groups:
        - name: nfs-health
          rules:
            - alert: NfsStaleMount
              expr: node_filesystem_readonly{job="vm-node-exporter", fstype="nfs4"} == 1
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "{{ $labels.instance }} NFS mount read-only on {{ $labels.mountpoint }}"
                description: "NFS mount {{ $labels.mountpoint }} on {{ $labels.instance }} is read-only, likely stale or TrueNAS unreachable."
            # NfsMountMissing removed: node_exporter reports device_error=1
            # for all NFS mounts (normal behavior) and skips avail_bytes,
            # causing absent_over_time to always fire. TrueNAS availability
            # is covered by the NodeDown alert on 192.168.1.15:9100.
    prometheus-self:
      groups:
        - name: prometheus-health
          rules:
            - alert: PrometheusTargetScrapeFailures
              expr: increase(prometheus_target_scrapes_sample_duplicate_timestamp_total[5m]) > 0 or increase(prometheus_target_scrapes_exceeded_body_size_limit_total[5m]) > 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Prometheus scrape issues detected"
                description: "Prometheus is experiencing scrape errors (duplicates or body size exceeded)."
            - alert: PrometheusTsdbErrors
              expr: increase(prometheus_tsdb_compactions_failed_total[5m]) > 0 or increase(prometheus_tsdb_wal_corruptions_total[5m]) > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Prometheus TSDB errors"
                description: "Prometheus storage is experiencing compaction failures or WAL corruption."
            - alert: PrometheusRuleEvalFailures
              expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Prometheus rule evaluation failures"
                description: "Prometheus is failing to evaluate alerting/recording rules."
            - alert: PrometheusNotificationsDropped
              expr: rate(prometheus_notifications_dropped_total[5m]) > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Prometheus is dropping notifications to AlertManager"
                description: "Prometheus has been dropping alert notifications for 5 minutes. AlertManager may be unreachable. Current rate: {{ $value | printf \"%.2f\" }}/s."
    proxmox-alerts:
      groups:
        - name: proxmox-availability
          rules:
            - alert: PveExporterDown
              expr: up{job="proxmox"} == 0
              for: 3m
              labels:
                severity: critical
              annotations:
                summary: "PVE exporter unreachable at {{ $labels.instance }}"
                description: "Proxmox exporter {{ $labels.instance }} has been down for 3 minutes."
            - alert: PveGuestDown
              # The tags label is a semicolon-delimited list from Proxmox
              # (e.g. "linux;services;no-alert"). Anchor on the separators
              # so tag names like 'no-alert-policy' or 'preventive-maintenance'
              # do NOT silently suppress alerts.
              expr: |
                (
                  (pve_up{job="proxmox", id=~"qemu/.*"} == 0)
                  and on(id, instance)
                  (pve_onboot_status{job="proxmox"} == 1)
                )
                * on(id, instance) group_left(name, node, tags)
                (pve_guest_info{job="proxmox", template="0", tags!~"(.*;)?(no-alert|maintenance)(;.*)?"})
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.name }} ({{ $labels.id }})"
                description: |
                  VM {{ $labels.name }} ({{ $labels.id }}) on {{ $labels.node }} has onboot=1 but is not running. To silence: `qm set {{ $labels.id | reReplaceAll "^qemu/" "" }} --tags <existing>,no-alert` (permanent) or `,maintenance` (temporary).
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/infrastructure/monitoring/kube-prometheus-stack/values.yaml#PveGuestDown"
            - alert: PveGuestMaintenanceTagStale
              # Same anchored-separator match as PveGuestDown so we don't
              # warn on harmless tags that happen to contain the substring.
              expr: |
                pve_guest_info{job="proxmox", template="0", tags=~"(.*;)?maintenance(;.*)?"}
              for: 24h
              labels:
                severity: info
              annotations:
                summary: "{{ $labels.name }} still tagged 'maintenance' after 24h"
                description: |
                  VM {{ $labels.name }} ({{ $labels.id }}) on {{ $labels.node }} has been tagged 'maintenance' for over 24 hours. Remove with `qm set {{ $labels.id | reReplaceAll "^qemu/" "" }} --tags <existing tags without maintenance>` or this VM stays silently excluded from PveGuestDown.
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/infrastructure/monitoring/kube-prometheus-stack/values.yaml#PveGuestMaintenanceTagStale"
            - alert: PveQuorumDegraded
              expr: pve_cluster_quorum_total_votes{job="vm-node-exporter"} < pve_cluster_quorum_expected_votes{job="vm-node-exporter"}
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: "PVE cluster quorum degraded on {{ $labels.instance }}"
                description: "Cluster has {{ $value }} votes, expected {{ printf `pve_cluster_quorum_expected_votes{instance=\"%s\"}` $labels.instance | query | first | value }}. A node or qdevice may be down."
            - alert: PveQuorumLost
              expr: pve_cluster_quorum_quorate{job="vm-node-exporter"} == 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "PVE cluster has LOST quorum on {{ $labels.instance }}"
                description: "Cluster is no longer quorate. HA operations are blocked."
        - name: proxmox-resources
          rules:
            - alert: PveHighCpu
              expr: pve_cpu_usage_ratio{job="proxmox", id=~"node/.*"} > 0.9
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "PVE host {{ $labels.id }} CPU > 90%"
                description: "Proxmox host CPU is at {{ $value | humanizePercentage }}."
            - alert: PveHighMemory
              expr: pve_memory_usage_bytes{job="proxmox", id=~"node/.*"} / pve_memory_size_bytes{job="proxmox", id=~"node/.*"} > 0.9
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "PVE host {{ $labels.id }} memory > 90%"
                description: "Proxmox host memory usage is above 90%."
            - alert: PveStorageHigh
              expr: pve_disk_usage_bytes{job="proxmox", id=~"storage/.*"} / pve_disk_size_bytes{job="proxmox", id=~"storage/.*"} > 0.85
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "PVE storage {{ $labels.id }} > 85%"
                description: "Proxmox storage {{ $labels.id }} is above 85% capacity."

    etcd-health:
      groups:
        - name: etcd-database
          rules:
            - alert: EtcdDbSizeLarge
              expr: etcd_mvcc_db_total_size_in_bytes > 100e6
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "etcd db {{ $labels.pod }} is {{ $value | humanize1024 }}"
                description: "etcd member {{ $labels.pod }} has a database larger than 100MB for over 1 hour. Run compaction + defragmentation to reclaim space before the db causes leader election instability. See 2026-04-18 RCA."
            - alert: EtcdDbSizeCritical
              expr: etcd_mvcc_db_total_size_in_bytes > 200e6
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "etcd db {{ $labels.pod }} is {{ $value | humanize1024 }} (critical)"
                description: "etcd member {{ $labels.pod }} has a database larger than 200MB. This caused controller-manager crash-loops in the 2026-04-18 incident at 124MB. Immediate compaction + defrag required."

    external-secrets-health:
      groups:
        - name: external-secrets-sync
          rules:
            # Catch ExternalSecret retry loops BEFORE they drain the 1Password
            # daily cap. ESO retries on error with ~6min backoff regardless of
            # refreshInterval, so a single bad reference can chew 200+/day.
            # This alert fires within 10m of the first failed sync, vs
            # OnePasswordQuotaLow which only fires after 800+ reads consumed.
            - alert: ExternalSecretNotReady
              expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} not ready"
                description: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has been Ready=False for 10m. ESO is retrying on backoff and will burn 1Password quota until the reference is fixed or the ES is deleted. Check `kubectl describe externalsecret -n {{ $labels.namespace }} {{ $labels.name }}` for the upstream error."
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/docs/runbooks/onepassword-quota.md#externalsecret-retry-alerts"
            # Active retry loop: >3 errors in 15min = ~12/hr = 288/day from one
            # bad ES alone = 28% of the 1P daily cap per broken reference.
            - alert: ExternalSecretSyncErrorBurst
              expr: sum by (namespace, name) (increase(externalsecret_sync_calls_error[15m])) > 3
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} sync errors: {{ $value | printf \"%.0f\" }}/15m"
                description: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has produced more than 3 sync errors in the last 15 minutes. This is an active retry loop that will exhaust the 1Password daily cap if left for ~4 hours. Fix the upstream reference or delete the ES."
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/docs/runbooks/onepassword-quota.md#externalsecret-retry-alerts"

    onepassword-quota:
      groups:
        - name: onepassword-quota
          rules:
            # Account-tier daily cap (Families plan: 1000 reads/day, shared across all service accounts).
            # The 2026-04-18 incident pinned this for ~24h and silently broke every ExternalSecret sync.
            # See ansible-quasarlab roles/op_quota_collector for the textfile source.
            # Burn rate: reads consumed in the trailing hour, independent of how
            # much is left. Real burn comes in spikes (+160 in 5m at 04:18 and
            # 05:18, +94 at 14:33 on 2026-09-12), which the remaining-quota
            # rules below only notice hours later. Quiet baseline peaks at
            # ~14/h over 48h of history, so 50/h has wide headroom.
            #
            # onepassword_ratelimit_used is a gauge that drops once a day when
            # the window rolls (831 -> 45 at 02:51 UTC on 2026-09-12). increase()
            # and rate() read any drop as a counter reset, so do not use them.
            # Instead score each 1m step of the gauge:
            #   - ordinary step: the climb, clamp_min'd so a stray decrease is 0.
            #   - genuine rollover: the whole post-reset value, because the
            #     account counter restarts from zero and everything it shows
            #     was read since the reset. #200 clamped this step to 0 and
            #     silently dropped those reads (#201).
            # A rollover is told apart from an ordinary decrease by
            # reset_seconds jumping up by more than an hour (it only ever
            # counts down between rolls; 240 -> 82800 at both rolls in 48h).
            # Steps where the collector was failing a minute earlier are
            # dropped, so a bad run that zeroes the gauge cannot count its
            # recovery as a spike. Reads after the last pre-reset sample but
            # before the reset remain unobservable (at most one collector
            # interval).
            - alert: OnePasswordQuotaBurnRateHigh
              expr: |
                sum_over_time(
                  (
                    (
                      (
                        clamp_min(
                          onepassword_ratelimit_used{type="account",action="read_write"}
                            - onepassword_ratelimit_used{type="account",action="read_write"} offset 1m,
                          0
                        )
                        unless on (instance)
                        (
                          onepassword_ratelimit_reset_seconds{type="account",action="read_write"}
                            - onepassword_ratelimit_reset_seconds{type="account",action="read_write"} offset 1m
                          > 3600
                        )
                      )
                      or on (instance)
                      (
                        clamp_min(onepassword_ratelimit_used{type="account",action="read_write"}, 0)
                        and on (instance)
                        (
                          onepassword_ratelimit_reset_seconds{type="account",action="read_write"}
                            - onepassword_ratelimit_reset_seconds{type="account",action="read_write"} offset 1m
                          > 3600
                        )
                      )
                    )
                    and on (instance) (onepassword_ratelimit_collector_success offset 1m == 1)
                  )[1h:1m]
                ) > 50
              for: 0m
              labels:
                severity: warning
              annotations:
                summary: "1Password account quota burning fast ({{ $value | printf \"%.0f\" }} reads in the last hour)"
                description: "The 1Password account counter climbed {{ $value | printf \"%.0f\" }} reads in the last hour (threshold 50/h, normal is under 15/h). A burst this size is a batch job, an inventory resolve, or an ESO retry loop. Find the caller now with `journalctl -t op-wrapper --since -1h` on command-center1, before the daily cap drains. Reset in {{ with query \"onepassword_ratelimit_reset_seconds{type='account',action='read_write'}\" }}{{ . | first | value | humanizeDuration }}{{ end }}."
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/docs/runbooks/onepassword-quota.md#burn-rate-alert"
            # Target is to never use more than half the daily cap, keeping the
            # other half as wiggle room for incidents and interactive `op` use.
            - alert: OnePasswordQuotaHalfConsumed
              expr: onepassword_ratelimit_used{type="account",action="read_write"} / onepassword_ratelimit_limit{type="account",action="read_write"} >= 0.5
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "1Password account quota at {{ $value | humanizePercentage }} of the daily cap"
                description: "1Password daily account usage has been at or above 50% of the cap for 15m ({{ $value | humanizePercentage }} used). The target is to stay under half. Identify the heaviest consumers before they push us toward critical. Reset in {{ with query \"onepassword_ratelimit_reset_seconds{type='account',action='read_write'}\" }}{{ . | first | value | humanizeDuration }}{{ end }}."
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/docs/runbooks/onepassword-quota.md"
            - alert: OnePasswordQuotaLow
              expr: onepassword_ratelimit_remaining{type="account",action="read_write"} < 200
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "1Password account quota low ({{ $value }} remaining)"
                description: "1Password daily account cap has dropped below 200/1000 remaining for 10m. Intervene now: pause non-critical automation or widen ESO refresh intervals. Reset in {{ with query \"onepassword_ratelimit_reset_seconds{type='account'}\" }}{{ . | first | value | humanizeDuration }}{{ end }}."
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/docs/runbooks/onepassword-quota.md"
            - alert: OnePasswordQuotaCritical
              expr: onepassword_ratelimit_remaining{type="account",action="read_write"} < 50
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "1Password account quota CRITICAL ({{ $value }} remaining)"
                description: "1Password daily account cap has dropped below 50/1000 remaining. Secrets are about to stop syncing. Trip the kill switch and scale ESO to 0 until reset."
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/docs/runbooks/onepassword-quota.md"
            - alert: OnePasswordQuotaExhausted
              expr: onepassword_ratelimit_remaining{type="account",action="read_write"} == 0
              for: 0m
              labels:
                severity: critical
              annotations:
                summary: "1Password account quota EXHAUSTED"
                description: "1Password daily account cap is fully consumed. Every `op` call will 429 until reset. ExternalSecret sync is broken. Trip kill switch, scale ESO to 0, wait for reset window."
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/docs/runbooks/onepassword-quota.md"
            # Per-service-account hourly limits. Normally the account daily cap
            # is the binding constraint, but a single SA looping on reads or a
            # bulk-write script can trip the hourly tier first. Catches the
            # runaway in ~10-15 min so we can fix the caller before the daily
            # cap also drains.
            - alert: OnePasswordTokenReadHourlyLow
              expr: onepassword_ratelimit_remaining{type="token",action="read"} < 200
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "1Password SA hourly read quota low ({{ $value }} remaining of 1000)"
                description: "A service account has burned more than 800/1000 hourly reads for 10m. Normal operation is well under 100/hr. Likely cause: runaway loop or cache miss storm on one caller. Identify via `journalctl -t op-wrapper` on command-center1."
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/docs/runbooks/onepassword-quota.md"
            - alert: OnePasswordTokenWriteHourlyLow
              expr: onepassword_ratelimit_remaining{type="token",action="write"} < 20
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "1Password SA hourly write quota low ({{ $value }} remaining of 100)"
                description: "A service account has burned more than 80/100 hourly writes for 5m. We almost never write from automation, so any burst is suspicious. Confirm it's not a rogue bulk-rotation script or misconfigured migration tool."
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/docs/runbooks/onepassword-quota.md"
            # Collector staleness: distinct from "quota is fine" so operator can tell measurement failure
            # apart from a healthy cluster.
            - alert: OnePasswordQuotaCollectorStale
              expr: onepassword_ratelimit_collector_success == 0
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "1Password quota collector failing on {{ $labels.instance }}"
                description: "op-quota-collector has been reporting success=0 for 30m. Quota metrics are stale. Check `journalctl -t op-quota-collector -n 50` on the host. Common causes: kill switch tripped, token unreadable, `op` CLI missing."
                runbook_url: "https://github.com/mithr4ndir/k8s-argocd/blob/main/docs/runbooks/onepassword-quota.md"

    wazuh-health:
      groups:
        # Liveness. Necessary but demonstrably not sufficient: on 2026-08-06 the
        # SIEM was found to have been collecting nothing for months, and all four
        # of these rules were green the entire time. wazuh-manager, wazuh-indexer
        # and wazuh-dashboard were active, and filebeat.service was active while
        # failing to reach the indexer across 15,403 reconnect attempts.
        # The wazuh-data-flow group below alerts on absence of data instead.
        - name: wazuh-services
          rules:
            - alert: WazuhManagerDown
              expr: node_systemd_unit_state{job="vm-node-exporter", name="wazuh-manager.service", state="active"} == 0
              for: 3m
              labels:
                severity: critical
              annotations:
                summary: "Wazuh Manager is down on {{ $labels.instance }}"
                description: "wazuh-manager.service is not active on {{ $labels.instance }} for 3 minutes. Security monitoring is offline."
            - alert: WazuhIndexerDown
              expr: node_systemd_unit_state{job="vm-node-exporter", name="wazuh-indexer.service", state="active"} == 0
              for: 3m
              labels:
                severity: critical
              annotations:
                summary: "Wazuh Indexer is down on {{ $labels.instance }}"
                description: "wazuh-indexer.service is not active on {{ $labels.instance }}. Alert indexing is offline."
            - alert: WazuhDashboardDown
              expr: node_systemd_unit_state{job="vm-node-exporter", name="wazuh-dashboard.service", state="active"} == 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Wazuh Dashboard is down on {{ $labels.instance }}"
                description: "wazuh-dashboard.service is not active on {{ $labels.instance }}."
            - alert: WazuhFilebeatDown
              expr: node_systemd_unit_state{job="vm-node-exporter", name="filebeat.service", state="active"} == 0
              for: 3m
              labels:
                severity: warning
              annotations:
                summary: "Filebeat is down on {{ $labels.instance }}"
                description: "filebeat.service is not active on {{ $labels.instance }}. Wazuh alerts are not being shipped to the indexer."

        # Data flow. These alert on the absence of data, which is the only thing
        # either 2026-08-06 failure actually changed.
        #
        #   1. No agent could enroll: the manager was missing the agent groups the
        #      agents requested, so authd rejected every enrollment and
        #      client.keys stayed empty. Agents log only "Unable to connect to any
        #      server", which reads like a firewall problem and is not.
        #   2. Filebeat was auto-upgraded past 7.10.2 and could no longer talk to
        #      OpenSearch, so nothing reached the indexer after 2026-04-10.
        #
        # Metrics come from the wazuh-indexer-metrics collector (ansible role
        # wazuh_indexer_metrics) via the node_exporter textfile collector.
        - name: wazuh-data-flow
          rules:
            - alert: WazuhIndexerAlertsStale
              # The single most important rule here: it goes red regardless of
              # which link in manager -> filebeat -> indexer broke. The SIEM
              # normally indexes ~20 alerts/minute, so an hour of total silence is
              # a failure, never a quiet period.
              expr: time() - wazuh_indexer_alerts_last_document_timestamp_seconds > 3600
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "Wazuh has indexed no alerts for {{ $value | humanizeDuration }}"
                description: |
                  No new document has reached wazuh-alerts-* in over an hour. The
                  SIEM is blind and every service will still look healthy. This
                  exact condition went unnoticed for ~4 months in 2026. Check:
                  1) `filebeat test output` on the manager. A 400 on `_license`
                  means Filebeat was upgraded past 7.10.2 and cannot talk to
                  OpenSearch; reinstall filebeat-oss 7.10.2 and hold it.
                  2) `tail /var/ossec/logs/alerts/alerts.json` to confirm the
                  manager is still producing alerts at all.
                  3) Indexer disk usage; a full disk flips indices to read-only.
            - alert: WazuhNoAgentsReporting
              # Only the manager (agent 000) reporting is the exact signature of
              # authd rejecting every agent enrollment.
              expr: wazuh_indexer_agents_reporting <= 1
              for: 30m
              labels:
                severity: critical
              annotations:
                summary: "Only {{ $value }} Wazuh agent(s) reporting"
                description: |
                  At most one agent has produced an alert in the last hour, which
                  usually means the manager itself and nothing else. Check
                  `/var/ossec/bin/agent_control -l` and
                  `grep 'Invalid group' /var/ossec/logs/ossec.log` on the manager:
                  a missing agent group makes authd reject the whole enrollment.
            - alert: WazuhAgentsPartiallyReporting
              # Below expected fleet size but not zero. NodeDown covers a host
              # being down; this covers a host being up but no longer shipping.
              expr: wazuh_indexer_agents_reporting < 10
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Only {{ $value }} Wazuh agents reporting (expected 14)"
                description: |
                  Fewer agents than expected produced alerts in the last hour. If
                  no NodeDown is firing, the hosts are up but their agents are not
                  shipping. Compare `/var/ossec/bin/agent_control -l` against the
                  Ansible inventory.
            - alert: WazuhIndexerUnreachable
              # Distinct from WazuhIndexerDown above: the unit can be active while
              # the indexer refuses queries or the client cert has expired.
              expr: wazuh_indexer_up == 0
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "Wazuh Indexer is not answering queries"
                description: |
                  The freshness collector could not query the Wazuh Indexer for 15
                  minutes even though the systemd unit may be active. Check
                  `systemctl status wazuh-indexer` and the admin client
                  certificate under /etc/wazuh-indexer/certs/.

        # Self-monitoring. A staleness alert that silently stops running has the
        # same failure mode as the outage it exists to catch.
        - name: wazuh-collector-health
          rules:
            - alert: WazuhIndexerMetricsCollectorStale
              expr: (time() - wazuh_indexer_metrics_last_run_timestamp_seconds > 1800) or absent(wazuh_indexer_metrics_last_run_timestamp_seconds)
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Wazuh freshness collector has not run"
                description: |
                  wazuh-indexer-metrics.timer has not produced a sample in over 30
                  minutes, or the metric has disappeared entirely. While this is
                  firing, the wazuh-data-flow alerts are not trustworthy. Check
                  `systemctl status wazuh-indexer-metrics.timer` on the manager.

    system-updates:
      groups:
        - name: unattended-upgrades
          rules:
            - alert: RebootRequired
              expr: node_reboot_required{job="vm-node-exporter"} == 1
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} requires a reboot"
                description: "{{ $labels.instance }} has pending updates that require a reboot."
            - alert: UnattendedUpgradesFailed
              expr: unattended_upgrades_success{job="vm-node-exporter"} == 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} unattended-upgrades failed"
                description: "Automatic security updates failed on {{ $labels.instance }}. Check /var/log/unattended-upgrades/."
            # Was `> 0 for 24h`, which fired continuously on 8 of 16 hosts and had
            # been firing on pve for weeks before the 2026-08-12 apt-daily hang
            # started. Permanently-on means it carried no signal: it could not
            # distinguish "pve stopped patching entirely for 11 days" from a
            # normal day. min_over_time means we only fire when the count never
            # once reached zero across a whole week, which is the actual "this
            # host is not working its queue down" condition.
            #
            # Known remaining noise: hosts whose pending security packages are
            # deliberately blacklisted never reach zero, so they still fire
            # (jellyfin and k8cluster2 on nvidia-*, k8cluster1/3 on kernel
            # metapackages). Fixing that properly means making the metric count
            # only what unattended-upgrades would actually install rather than
            # everything in the -security pocket. Tracked separately.
            - alert: SecurityUpdatesPending
              expr: min_over_time(unattended_upgrades_pending_security{job="vm-node-exporter"}[7d]) > 0
              for: 12h
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} is not working down its security updates"
                description: "{{ $labels.instance }} has not reached zero pending security updates at any point in the last 7 days. Either unattended-upgrades is not applying them, or the remaining ones are blacklisted. Check `unattended-upgrade --dry-run --debug` on the host."

            # Catches the 2026-08-12 pve failure directly and within the hour.
            # A hung apt-daily oneshot pins itself in "activating", and systemd
            # will not re-trigger a timer whose service is still activating, so
            # both apt timers go to NEXT=n/a and the host stops patching
            # entirely. On pve that ran for 10 days before anyone noticed, and
            # only surfaced because the held lists lock broke interactive
            # `apt update`. A healthy run finishes in seconds, so an hour in
            # "activating" is already far outside normal.
            - alert: AptDailyStuck
              expr: node_systemd_unit_state{job="vm-node-exporter", name=~"apt-daily(-upgrade)?\\.service", state="activating"} == 1
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.name }} stuck activating on {{ $labels.instance }}"
                description: "{{ $labels.name }} has been in the activating state on {{ $labels.instance }} for over an hour, which means a fetch is hung. While it stays there its timer cannot re-fire, so this host has silently stopped patching. Fix: `systemctl stop {{ $labels.name }}` on the host, then confirm `systemctl list-timers apt-daily apt-daily-upgrade` shows a real NEXT again."

        # Absence-of-data companion to the group above. The rules there all
        # read from the apt cache, so anything that stops the cache updating
        # also freezes them: during the pve hang unattended_upgrades_pending_security
        # sat frozen at 13 for 11 days and looked entirely normal. This rule
        # reads the last-run timestamp instead, which keeps advancing only if
        # unattended-upgrades genuinely runs.
        - name: unattended-upgrades-freshness
          rules:
            - alert: UnattendedUpgradesStale
              expr: time() - unattended_upgrades_last_run_timestamp_seconds{job="vm-node-exporter"} > 3 * 86400
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} has not run unattended-upgrades in over 3 days"
                description: "unattended-upgrades last completed on {{ $labels.instance }} more than 3 days ago. It is scheduled daily, so this means the apt timers are not firing (see AptDailyStuck) or the service is broken. A value far in the future here means the metric reports 0, which is the sentinel for never ran."

    service-down-alerts:
      groups:
        - name: service-health
          rules:
            - alert: ServiceDown
              expr: node_systemd_unit_state{job="vm-node-exporter", state="failed"} == 1
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "{{ $labels.name }} is down on {{ $labels.instance }}"
                description: "Systemd unit {{ $labels.name }} has been in failed state on {{ $labels.instance }} for 2 minutes."
            # type!="oneshot" matters. A oneshot that has completed successfully
            # sits in "inactive" until its timer fires again, which is the normal
            # healthy state, not an outage. Without this exclusion, adding the apt
            # daily units to the scrape baseline fired ServiceInactive on all 12
            # hosts at once. Failed oneshots are still caught by ServiceDown above,
            # and a oneshot that stops running entirely is caught by AptDailyStuck
            # and UnattendedUpgradesStale.
            - alert: ServiceInactive
              expr: node_systemd_unit_state{job="vm-node-exporter", state="active", type!="oneshot"} == 0 and ignoring(state) node_systemd_unit_state{job="vm-node-exporter", state="failed", type!="oneshot"} == 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.name }} is not running on {{ $labels.instance }}"
                description: "Systemd unit {{ $labels.name }} on {{ $labels.instance }} is not in active or failed state for 5 minutes."

    # The two alerts about one specific run, AnsiblePlaybookFailed and
    # AnsiblePlaybookMadeChanges, carry a link to that run's ARA report. The
    # link comes from ansible_playbook_last_run_info, written by the run
    # wrappers (ansible-quasarlab scripts/lib/ara-run-links.sh), and is looked
    # up with `query` inside the annotation ON PURPOSE: joining it into the
    # expression with group_left would put the run id in the alert's label set,
    # so every hourly run would change the alert's identity and the same
    # failing playbook would resolve and re-fire all day.
    #
    # When the series is absent (ARA down at write time, or the wrapper not
    # deployed yet) the link line is simply omitted. There is no fallback to
    # the ARA index: a link that does not go to the run you are reading about
    # has to be checked before it can be trusted, which is worse than no link.
    # AnsibleRepoSyncFailed has no link because it fires before any playbook
    # runs, and the staleness alerts have none because a timer that never ran
    # has no run to point at.
    ansible-automation:
      groups:
        - name: ansible-timer
          rules:
            - alert: AnsiblePlaybookFailed
              expr: ansible_playbook_success{job="vm-node-exporter"} == 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.playbook }} failed on hosts: {{ $labels.failed_hosts }}"
                description: 'Playbook {{ $labels.playbook }} failed on hosts: {{ $labels.failed_hosts }}. Check /var/log/ansible-quasarlab/ on {{ $labels.instance }}.{{ with query (printf "ansible_playbook_last_run_info{job=\"vm-node-exporter\",playbook=%q}" $labels.playbook) }} [Open the failed run in ARA]({{ . | first | label "ara_url" }}){{ end }}'
            # The runners refuse to execute when they cannot pin their automation
            # checkout to origin/main, and write this metric on the way out. Without
            # it a refused run is only visible as AnsibleRunStale an hour later, and
            # says nothing about why. See ansible-quasarlab scripts/lib/sync-repo.sh.
            - alert: AnsibleRepoSyncFailed
              expr: ansible_run_repo_sync_success{job="vm-node-exporter"} == 0 or ansible_security_run_repo_sync_success{job="vm-node-exporter"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Ansible cannot pin {{ $labels.repo }} to its release branch"
                description: "{{ $labels.instance }} refused to run scheduled playbooks because {{ $labels.repo }} could not be synced to its pinned ref. No configuration is being enforced until this is fixed."
            - alert: AnsibleRunStale
              expr: time() - ansible_run_timestamp_seconds{job="vm-node-exporter"} > 3600
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Ansible timer hasn't run in over 1 hour on {{ $labels.instance }}"
                description: "Last ansible run was {{ $value | humanizeDuration }} ago on {{ $labels.instance }} ({{ $labels.target_address }}). The systemd timer may be stopped or stuck."
            - alert: AnsiblePlaybookMadeChanges
              expr: sum by (playbook) (ansible_playbook_changed_tasks{job="vm-node-exporter"}) > 0
              for: 5m
              labels:
                severity: info
              annotations:
                summary: "{{ $labels.playbook }} made changes"
                description: 'Playbook {{ $labels.playbook }} has had changed tasks for over 5 minutes. Check /var/log/ansible-quasarlab/ for details.{{ with query (printf "ansible_playbook_last_run_info{job=\"vm-node-exporter\",playbook=%q}" $labels.playbook) }} [See what changed in ARA]({{ . | first | label "ara_url" }}){{ end }}'
            - alert: AnsibleSecurityRunStale
              expr: time() - ansible_security_run_timestamp_seconds{job="vm-node-exporter"} > 3600
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "Security enforcement hasn't run in over 1 hour on {{ $labels.instance }}"
                description: "Last security timer run was {{ $value | humanizeDuration }} ago on {{ $labels.instance }}. Wazuh/CrowdSec config enforcement is not converging."

    lab-scout-alerts:
      groups:
        - name: lab-scout
          rules:
            # Weekly CronJob (apps/automation/lab-scout). KubeJobFailed covers a
            # run that fails; this covers runs that never happen or never finish
            # (suspended, image pull errors, schedule missed) and a job that has
            # never succeeded at all, where the last-success series is absent.
            # Replayed 2026-09-14 against donchian-signal and dream-team: both
            # branches return those jobs at a 1h threshold and nothing at 8d.
            - alert: LabScoutDigestStale
              expr: |
                (time() - kube_cronjob_status_last_successful_time{namespace="automation",cronjob="lab-scout"} > 691200)
                or
                ((time() - kube_cronjob_created{namespace="automation",cronjob="lab-scout"} > 691200)
                  unless on(namespace, cronjob)
                  kube_cronjob_status_last_successful_time{namespace="automation",cronjob="lab-scout"})
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Radagast has not posted a lab ideas digest in over 8 days"
                description: "CronJob automation/lab-scout has had no successful run for {{ $value | humanizeDuration }}. Check `kubectl -n automation get jobs -l app.kubernetes.io/name=lab-scout` and the last pod's logs."

        - name: outings
          rules:
            # Weekly CronJob (apps/automation/outings), same shape as
            # LabScoutDigestStale. The job exits non-zero when it posts
            # nothing (too few checked events, model or post failure), so a
            # missed week shows here as well as in KubeJobFailed.
            - alert: OutingsDigestStale
              expr: |
                (time() - kube_cronjob_status_last_successful_time{namespace="automation",cronjob="outings"} > 691200)
                or
                ((time() - kube_cronjob_created{namespace="automation",cronjob="outings"} > 691200)
                  unless on(namespace, cronjob)
                  kube_cronjob_status_last_successful_time{namespace="automation",cronjob="outings"})
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "The weekly outings digest has not been sent in over 8 days"
                description: "CronJob automation/outings has had no successful run for {{ $value | humanizeDuration }}. Check `kubectl -n automation get jobs -l app.kubernetes.io/name=outings` and the last pod's logs (look for event=digest_failed)."

    pbs-backup-alerts:
      groups:
        # pbs1 (192.168.1.61) serves hourly backups for the whole lab, and
        # pbs2 (192.168.1.62) pulls a copy of its datastore hourly at :30.
        #
        # The rules about whether BACKUPS are happening are scoped to
        # instance="pbs1" on purpose. pbs2 runs the same collector over its own
        # datastore, and a synced snapshot keeps the source's timestamp, so
        # without the scope every per-guest fault would alert twice for one
        # cause. The replica gets its own rules below, which ask a different
        # question: is the copy keeping up with the original.
        #
        # Before
        # these rules Prometheus had 295 alerts and not one mentioned backups,
        # so a silent failure would only have surfaced during a restore. Series
        # come from the pbs-backup-collector in ansible-quasarlab roles/pbs,
        # which reads the datastore on disk and only counts a snapshot that has
        # a manifest, because PBS writes the manifest last and an aborted
        # backup leaves a directory behind.
        - name: pbs-backup
          rules:
            # The primary signal. The job runs hourly over every included
            # guest, so if the NEWEST backup anywhere is old, the job itself
            # has stopped. Aggregated deliberately: it cannot false-positive on
            # the guests the job excludes, and it is the one that matters.
            #
            # Three arms, because the rule has three ways to be silently
            # wrong. max() over an EMPTY vector returns nothing, not zero, so
            # the first arm alone goes quiet exactly when the datastore holds
            # no restorable backup at all. The second catches the collector or
            # its textfile disappearing. The third is the gap between them:
            # the collector running fine and reporting not one complete
            # snapshot for any guest, where the heartbeat is present so
            # absent() is false and max() is empty so the threshold is never
            # evaluated. count() reduces it to a labelless series to match
            # the other arms.
            - alert: PbsBackupJobStale
              expr: |
                time() - max(pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs1"}) > 5400
                or
                absent(pbs_backup_collector_timestamp_seconds{job="vm-node-exporter", instance="pbs1"})
                or
                count(
                  pbs_backup_collector_timestamp_seconds{job="vm-node-exporter", instance="pbs1"}
                  unless on(instance)
                  pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs1"}
                ) > 0
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "No PBS backup has completed anywhere in over 90 minutes"
                description: "The hourly PBS backup job has not produced a completed snapshot for any guest in over 90 minutes, so the lab is accumulating unbacked-up change. Check `systemctl status pbs-backup-collector` on pbs1, the job on a PVE node with `cat /etc/pve/jobs.cfg`, and the PBS task log at https://192.168.1.61:8007."

            # One guest failing while the rest succeed. The aggregate above
            # cannot see this: max() stays fresh as long as anything backs up.
            #
            # WHICH GUESTS ARE IN SCOPE is decided by the metric's own
            # history, not by a list. The vzdump job excludes 102, 103, 120,
            # 9000, 9001 and 9002 (templates, and the two backup servers,
            # which cannot usefully back up to their own datastore), and their
            # last snapshots keep ageing forever, so a bare threshold would
            # alert on them permanently. Mirroring `exclude` from
            # /etc/pve/jobs.cfg into a `guest!~` matcher was the obvious fix
            # and the wrong one: the list then lives in two places and drifts
            # silently, which is how node_exporter's systemd unit-include
            # allowlist hid three real outages here.
            #
            # So the second arm asks instead: was this guest backed up
            # recently at ANY point in the last 7 days? A guest in the job
            # answers yes; a permanently excluded guest answers no and is
            # never considered. Verified against live Prometheus on
            # 2026-10-15: the gate selects exactly 18 guests, which is exactly
            # the `included_volumes` set the vzdump job reports
            # (ansible-quasarlab#217). Nothing had to be enumerated.
            #
            # The gate window must be much LONGER than the staleness
            # threshold, or the alert would resolve itself: at 6h stale with a
            # 7d window the alert keeps firing for about six and a half days
            # after onset, which is long enough to be seen.
            #
            # 15m resolution. 1h was tried first, on the reasoning that the
            # inner condition stays true for a full 6h once a backup lands so
            # an hourly grid cannot step over it, and 168 points is cheaper
            # than 672. It was WRONG, and only evaluating it against live
            # Prometheus showed why: subquery steps are aligned to the epoch,
            # not to the evaluation time, so the newest 1h-aligned step can be
            # most of an hour in the past. Against a series 20 minutes old
            # every step landed before the series existed, the gate returned
            # no series at all, and the whole rule was silently unable to
            # fire. The promtool tests passed throughout, because a fixture
            # hands the rule seven days of history that real Prometheus does
            # not have yet. A coarse grid over a young series is the ordinary
            # way a subquery quietly returns nothing.
            #
            # So the grid has to stay close to the scrape interval, not to the
            # width of the condition. 15m bounds the blind window after a
            # fresh deploy to one step, and 672 points over 18 series is
            # roughly 12k samples per evaluation, which is cheap.
            - alert: PbsGuestBackupStale
              expr: |
                (
                  time() - pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs1"} > 6 * 3600
                )
                and on(datastore, guest_type, guest)
                (
                  max_over_time(
                    (pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs1"} > time() - 6 * 3600)[7d:15m]
                  ) > 0
                )
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "Guest {{ $labels.guest }} has had no completed backup for over 6h"
                description: "{{ $labels.guest_type }}/{{ $labels.guest }} has no completed snapshot in datastore {{ $labels.datastore }} for over 6 hours while other guests are backing up normally, so this is one guest failing rather than the job being down. It was backing up normally within the last 7 days, so it is in the job rather than deliberately excluded. Check the PBS task log at https://192.168.1.61:8007 for this group, and `qm config {{ $labels.guest }}` for a disk that lost its backup flag."

            # Attempts happened and every one of them failed. PBS writes
            # index.json.blob LAST, so a backup that dies partway leaves a
            # snapshot directory with no manifest; a guest with directories
            # and no manifest anywhere has never once produced a restorable
            # backup. PbsGuestBackupStale cannot catch this, because its gate
            # asks when the guest was last FRESH and the answer is never.
            #
            # Deliberately keyed on dir_count > 0 rather than on the
            # guests_without_complete gauge. pbs1 itself (vm103) sits in the
            # datastore with an owner file, zero snapshot directories and no
            # backup, because the job excludes it and a backup that fails
            # before PBS creates a directory leaves nothing else behind. It is
            # visible as dir_count 0 and is deliberately not alertable: an
            # alert on "registered but never completed" would be permanently
            # red on this lab, and a permanently firing alert is worse than
            # none. Verified on live labels 2026-10-15: relaxing this to >= 0
            # returns exactly vm103 and nothing else.
            - alert: PbsGuestBackupsAllFailing
              expr: |
                pbs_guest_snapshot_dir_count{job="vm-node-exporter", instance="pbs1"} > 0
                unless on(datastore, guest_type, guest)
                pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs1"}
              for: 30m
              labels:
                severity: critical
              annotations:
                summary: "Every backup attempt for {{ $labels.guest }} has failed"
                description: "{{ $labels.guest_type }}/{{ $labels.guest }} has {{ $value }} snapshot directories in datastore {{ $labels.datastore }} and not one of them carries a manifest, so every attempt died partway and the guest has no restorable backup at all. Read the failing task at https://192.168.1.61:8007; a guest that was only just added to the job has never been protected, not merely fallen behind."

            # Does the second copy still exist and is it current? Everything
            # above would stay green with replication dead, because pbs1 alone
            # looks perfectly healthy while quietly becoming a single point of
            # failure again. That is precisely the state the lab was in until
            # 2026-10-15, and nothing reported it.
            #
            # The sync runs hourly at :30, so 3h is two missed runs. The
            # absent() arm catches the replica that never syncs at all, which a
            # lag comparison cannot see because one side of the subtraction is
            # simply missing.
            - alert: PbsReplicaLagging
              expr: |
                max(pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs1"})
                  - max(pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs2"}) > 10800
                or
                absent(pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs2"})
              for: 1h
              labels:
                severity: critical
              annotations:
                summary: "The pbs2 replica is more than 3h behind pbs1"
                description: "pbs2 pulls pbs1's datastore hourly at :30 and has fallen more than three hours behind, or is reporting no snapshots at all. Every backup is effectively back on one host. Check the sync job on pbs2 with `proxmox-backup-manager sync-job list` and its last task log; an expired `sync@pbs!pbs2` token or a regenerated pbs1 certificate both break the pull while leaving pbs1 healthy."

            # The aggregate above is satisfied by ONE group syncing, so a
            # single guest that never replicates hides behind the others. This
            # is the per-guest version: present on the primary, absent from the
            # replica. Three hours is three sync cycles, which is slack enough
            # for a newly created guest to land.
            #
            # Scope comes from the same history gate as PbsGuestBackupStale,
            # for the same reason: the excluded guests' stale groups DO get
            # synced, but a list of them here would drift against
            # /etc/pve/jobs.cfg.
            - alert: PbsReplicaMissingGuest
              expr: |
                (
                  pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs1"}
                  and on(datastore, guest_type, guest)
                  (
                    max_over_time(
                      (pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs1"} > time() - 6 * 3600)[7d:15m]
                    ) > 0
                  )
                )
                unless on(guest, guest_type)
                pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs2"}
              for: 3h
              labels:
                severity: warning
              annotations:
                summary: "Guest {{ $labels.guest }} exists on pbs1 but not on the replica"
                description: "{{ $labels.guest_type }}/{{ $labels.guest }} has a completed backup on pbs1 and none on pbs2, so this guest has exactly one copy while the rest of the lab has two. Check the sync job's last task log on pbs2 for a per-group failure; a group whose owner differs on the two stores fails individually and the job still reports success."

            # The PBS form of the backup=0 trap. The snapshot completed, so it
            # is not stale and nothing else notices, but it contains no disk
            # index and would restore nothing. A vzdump job hid exactly this
            # shape in this lab before (ansible-quasarlab#173).
            #
            # Gated on the guest being CURRENT. A permanently excluded guest
            # keeps its last snapshot forever, so if one of those ever held
            # zero disk indexes an ungated rule would be red for good. For a
            # guest that is actually in the job, "fresh and holds no disks" is
            # the whole point of the alert.
            - alert: PbsBackupRestoresNothing
              expr: |
                pbs_snapshot_disk_index_count{job="vm-node-exporter", instance="pbs1"} == 0
                and on(datastore, guest_type, guest)
                (time() - pbs_snapshot_last_complete_timestamp_seconds{job="vm-node-exporter", instance="pbs1"} < 6 * 3600)
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "Latest backup of {{ $labels.guest }} contains no disks"
                description: "The newest completed snapshot for {{ $labels.guest_type }}/{{ $labels.guest }} has a manifest but zero disk indexes, so it reports success and restores nothing. Check the guest's disks are not excluded from backup (`qm config {{ $labels.guest }}` and look for backup=0)."

            # Capacity. Retention is 24 hourly / 7 daily / 4 weekly / 3 monthly
            # with GC at 03:30, so usage climbs while the window fills and
            # should then flatten. It went 25% to 57% over the eight days after
            # the store was built, which is the fill, but nothing was watching
            # whether it flattens.
            - alert: PbsDatastoreFilling
              expr: |
                100 * (1 - node_filesystem_avail_bytes{job="vm-node-exporter", mountpoint=~"/mnt/datastore/.*"}
                          / node_filesystem_size_bytes{job="vm-node-exporter", mountpoint=~"/mnt/datastore/.*"}) > 80
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "PBS datastore {{ $labels.mountpoint }} is over 80% full"
                description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is over 80% used. A full datastore fails backups rather than pruning harder. Check the prune job and GC with `proxmox-backup-manager prune-job list` and `proxmox-backup-manager garbage-collection status <store>` on pbs1."

            # Distinguishes "backups stopped" from "we stopped being able to
            # see them". PbsBackupJobStale fires either way, because a dead
            # collector freezes the timestamps, so this is the one that says
            # which. Not critical: backups may well still be running.
            #
            # The second arm is the case where the heartbeat DISAPPEARS rather
            # than freezing: the textfile deleted, the collector uninstalled,
            # or node_exporter losing the directory. A bare threshold returns
            # no vector then, so the rule whose whole job is to separate
            # "backups stopped" from "we stopped being able to see them" would
            # itself go quiet. Expressed as "the exporter is up and yet
            # exports no heartbeat", so it does not double up on NodeDown, and
            # per instance so pbs2 is covered too without naming a metric
            # twice.
            - alert: PbsBackupCollectorStale
              expr: |
                time() - pbs_backup_collector_timestamp_seconds{job="vm-node-exporter"} > 3600
                or
                (
                  up{job="vm-node-exporter", instance=~"pbs.*"} == 1
                  unless on(instance)
                  pbs_backup_collector_timestamp_seconds{job="vm-node-exporter"}
                )
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "PBS backup collector has not run for over an hour"
                description: "pbs-backup-collector.timer on {{ $labels.instance }} fires every 10 minutes and has not completed for over an hour, so backup freshness metrics are frozen and PbsBackupJobStale may be reporting the collector rather than the backups. Check `systemctl status pbs-backup-collector.timer pbs-backup-collector.service`."

    memory-sync-alerts:
      groups:
        # memory-sync.timer on command-center1 (ansible-quasarlab roles/cmd_center)
        # commits agent memory to claude-config. Before it existed, write-back
        # was manual and 68 memory changes sat on one disk for months, so the
        # failure to catch is quiet: nothing breaks, memory just stops being
        # backed up.
        - name: memory-sync
          rules:
            - alert: MemorySyncStale
              # Runs every 6h with up to 10m jitter; 14h means two runs missed.
              # absent() catches the timer never having run (heartbeat file gone).
              expr: |
                time() - memory_sync_last_success_timestamp_seconds{job="vm-node-exporter"} > 14 * 3600
                or
                absent(memory_sync_last_run_timestamp_seconds{job="vm-node-exporter", instance="command-center1"})
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "Agent memory has not synced to claude-config for over 14h"
                description: "memory-sync on {{ $labels.instance }} has not completed a sync in over 14 hours, so new agent memory exists only on that disk. Check `systemctl --user status memory-sync.timer memory-sync.service` and `journalctl --user -u memory-sync` as ladino."
            - alert: MemorySyncBlocked
              # The secret scan found something, or the scanner was unavailable.
              # Deliberately its own alert: this is not a broken job, it is the
              # job refusing to publish a possible credential.
              expr: memory_sync_blocked{job="vm-node-exporter"} == 1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Memory sync refused to push: possible secret in agent memory"
                description: "The gitleaks scan in memory-sync on {{ $labels.instance }} found something in claude-config/memory, or docker was unavailable, so nothing was pushed. Inspect without printing values: `docker run --rm -v ~/code/claude-config/memory:/scan:ro ghcr.io/gitleaks/gitleaks:v8.21.2 dir /scan --redact`. Remove the value from memory and assess rotation separately."
    agent-cmd-audit-alerts:
      groups:
        # Feed that posts every Bash command an AI agent runs on
        # command-center1 to Discord (ansible-quasarlab
        # roles/cmd_center/tasks/cmd_audit.yml). Metrics come from the
        # node_exporter textfile collector, so they only exist once
        # cmd_center_cmd_audit_enabled is true; every rule here is
        # absent-safe and stays quiet until then.
        - name: agent-cmd-audit
          rules:
            # THE rule that matters. Everything below proves a component ran;
            # this proves data arrived. An hourly canary goes through the same
            # entry point the hook uses, and the timestamp is stamped only
            # after Discord returns 2xx on a ?wait=true post, so it covers the
            # hook wiring, spool, rotation, redaction, secret resolution,
            # network and Discord acceptance in one series. Wazuh was green on
            # every liveness check for four months while collecting nothing;
            # this is the lesson from that.
            - alert: AgentCmdAuditCanaryStale
              expr: time() - agent_cmd_audit_canary_posted_timestamp_seconds{job="vm-node-exporter"} > 10800
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "The agent command audit feed has not posted a canary in over 3 hours"
                description: "The hourly canary on {{ $labels.instance }} last reached Discord {{ $value | humanizeDuration }} ago, so commands run by agents are not being recorded either. Check `systemctl status agent-cmd-audit.timer agent-cmd-audit-canary.timer` and `journalctl -t agent-cmd-audit -n 50` on the host."

            # A hung Type=oneshot pins itself in activating, and systemd will
            # not re-trigger a timer whose service is still activating, so one
            # wedged run ends every later run. Same failure that stopped apt
            # patching for 11 days. The unit is in node_exporter_systemd_units
            # for command-center1; without that entry this rule is vacuous.
            - alert: AgentCmdAuditStuck
              expr: node_systemd_unit_state{job="vm-node-exporter", name="agent-cmd-audit.service", state="activating"} == 1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "agent-cmd-audit.service is stuck activating on {{ $labels.instance }}"
                description: "The flush oneshot has been activating for over 10 minutes, far outside a normal sub-second run. While it stays there its timer cannot re-fire. Fix: `systemctl stop agent-cmd-audit.service` on the host, then confirm `systemctl list-timers agent-cmd-audit` shows a real NEXT again."

            # Discord unreachable, a bad webhook, or the 1Password kill switch
            # tripped. Nothing is lost while this fires: sealed batches are
            # kept and retried, and the oldest are only evicted at the cap.
            - alert: AgentCmdAuditBacklog
              expr: agent_cmd_audit_inbox_files{job="vm-node-exporter"} > 50
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "The agent command audit feed has {{ $value }} batches it cannot post"
                description: "Batches are spooling on {{ $labels.instance }} and not draining, so posts are failing. Check agent_cmd_audit_post_failures_total and agent_cmd_audit_no_webhook_total, and `journalctl -t agent-cmd-audit -n 50`."

            # Records that never reach Discord at all. Distinct from a withheld
            # command, which is a redaction working as designed and still
            # posts a line. reason= says which cap or lock was hit.
            - alert: AgentCmdAuditDropping
              expr: increase(agent_cmd_audit_dropped_total{job="vm-node-exporter"}[1h]) > 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "The agent command audit feed dropped records ({{ $labels.reason }})"
                description: "{{ $value | printf \"%.0f\" }} record(s) were dropped on {{ $labels.instance }} in the last hour with reason={{ $labels.reason }}. backlog or spool_full means the flusher is not keeping up; lock means contention in the recorder."

            # An audit control that is switched off must not quietly stay off.
            # Recording can be disabled with no deploy (touch the OFF file), so
            # without this a forgotten kill switch would look identical to a
            # quiet lab.
            - alert: AgentCmdAuditDisabled
              expr: agent_cmd_audit_enabled{job="vm-node-exporter"} == 0
              for: 24h
              labels:
                severity: info
              annotations:
                summary: "The agent command audit feed has been disabled for 24 hours"
                description: "Command recording has been off on {{ $labels.instance }} for a day. Re-enable it by removing ~/.local/state/agent-cmd-audit/OFF, or set cmd_center_cmd_audit_recording_enabled back to true if it was turned off in Ansible."

    snmp-network-alerts:
      groups:
        - name: snmp-availability
          rules:
            - alert: SnmpExporterDown
              expr: up{job="snmp-switch"} == 0
              for: 3m
              labels:
                severity: critical
              annotations:
                summary: "SNMP scrape of {{ $labels.instance }} failing"
                description: "Prometheus has been unable to scrape SNMP target {{ $labels.instance }} for 3 minutes. Either snmp-exporter is down or the device is unreachable. Check `kubectl -n monitoring logs deploy/snmp-exporter-prometheus-snmp-exporter` and ping the target."
        - name: snmp-link-status
          rules:
            - alert: SwitchUplinkDown
              expr: ifOperStatus{job="snmp-switch", ifAlias=~"(?i).*(uplink|pfsense|wan).*"} != 1
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Switch uplink {{ $labels.ifName }} on {{ $labels.instance }} is down"
                description: "Interface {{ $labels.ifName }} (alias '{{ $labels.ifAlias }}') has ifOperStatus != up for 1 minute. The switch's path to pfSense is broken. Check cable and pfSense LAN port status."
            - alert: SwitchPortDown
              expr: ifOperStatus{job="snmp-switch", ifAdminStatus="1"} == 2
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Switch port {{ $labels.ifName }} on {{ $labels.instance }} is down"
                description: "Interface {{ $labels.ifName }} (alias '{{ $labels.ifAlias }}') is administratively up but operationally down for 5 minutes. Cable, link partner, or speed/duplex mismatch."
        - name: snmp-link-quality
          rules:
            - alert: SwitchInterfaceErrors
              expr: rate(ifInErrors{job="snmp-switch"}[5m]) + rate(ifOutErrors{job="snmp-switch"}[5m]) > 1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Errors on {{ $labels.instance }} interface {{ $labels.ifName }}"
                description: "Interface {{ $labels.ifName }} (alias '{{ $labels.ifAlias }}') is seeing >1 packet error/sec for 10m. Likely cable, SFP, or duplex problem."
            - alert: SwitchInterfaceDiscards
              expr: rate(ifInDiscards{job="snmp-switch"}[5m]) + rate(ifOutDiscards{job="snmp-switch"}[5m]) > 10
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Packet discards on {{ $labels.instance }} interface {{ $labels.ifName }}"
                description: "Interface {{ $labels.ifName }} (alias '{{ $labels.ifAlias }}') is discarding >10 packets/sec for 10m. Either congestion or buffer exhaustion."

    truenas-storage-alerts:
      groups:
        # The tank pool and its SMART metrics come from the zfs-smart-textfile
        # exporter (ansible-quasarlab roles/truenas). Before this group existed
        # the exporter had metrics and NO alerts at all, so a degraded pool or a
        # failing disk was visible on a dashboard and paged nobody.
        - name: truenas-storage
          rules:
            # Whole-pool state. NOT sufficient for the failure this lab
            # actually has: on 2026-10-08 the bay 3 drive was FAULTED for half
            # an hour while `zpool list` kept saying tank was ONLINE, so this
            # rule never fired. ZfsVdevNotOnline below covers that case.
            - alert: ZfsPoolNotOnline
              expr: zfs_pool_health{job="vm-node-exporter"} != 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "ZFS pool {{ $labels.pool }} is not ONLINE"
                description: "Pool {{ $labels.pool }} on {{ $labels.instance }} reports health code {{ $value }} (0=ONLINE 1=DEGRADED 2=FAULTED 3=OFFLINE 4=UNAVAIL 5=REMOVED 6=UNKNOWN). Check `zpool status -v {{ $labels.pool }}`. Do NOT make pool topology changes mid-incident."
            - alert: ZfsVdevNotOnline
              # Per-disk state from `zpool status -j`, labelled with the tray
              # to pull (bay N = Nth tray from the left = kernel ataN) and the
              # serial. Three Inland IB24AK drives in tank drop off the SATA bus
              # repeatedly; this is the rule that names which one. The partner
              # lookup says whether the rest of that mirror is still healthy,
              # which decides how urgent it is: mirror-3 pairs two bad-batch
              # drives. `for: 2m` lets a deliberate reseat finish without paging.
              # The state is spelled out in the description, not just the summary:
              # the Discord card shows only the description.
              expr: zfs_vdev_state{job="vm-node-exporter"} != 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "ZFS disk in bay {{ $labels.bay }} ({{ $labels.serial }}) is {{ if eq $value 1.0 }}DEGRADED{{ else if eq $value 2.0 }}FAULTED{{ else if eq $value 3.0 }}OFFLINE{{ else if eq $value 4.0 }}UNAVAIL{{ else if eq $value 5.0 }}REMOVED{{ else }}UNKNOWN{{ end }} in {{ $labels.pool }}/{{ $labels.vdev }}"
                description: "Pool {{ $labels.pool }} {{ $labels.vdev }}: bay {{ $labels.bay }}, serial {{ $labels.serial }}, currently {{ $labels.device }}, is {{ if eq $value 1.0 }}DEGRADED{{ else if eq $value 2.0 }}FAULTED{{ else if eq $value 3.0 }}OFFLINE{{ else if eq $value 4.0 }}UNAVAIL{{ else if eq $value 5.0 }}REMOVED{{ else }}UNKNOWN{{ end }}. Rest of {{ $labels.vdev }}:{{ range query (printf `zfs_vdev_state{job=\"vm-node-exporter\",pool=\"%s\",vdev=\"%s\",guid!=\"%s\"}` $labels.pool $labels.vdev $labels.guid) }} bay {{ .Labels.bay }} ({{ .Labels.serial }}) {{ if eq .Value 0.0 }}ONLINE{{ else }}NOT ONLINE, code {{ .Value }}{{ end }};{{ end }} Check `zpool status -v {{ $labels.pool }}` and `journalctl -k | grep ata{{ $labels.bay }}`. Light the tray with `/root/ugreen_leds_cli disk{{ $labels.bay }}` before touching it, and confirm which port changed after a reseat."
            - alert: SmartDeviceHealthFailed
              expr: smart_device_health{job="vm-node-exporter"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "SMART health FAILED on bay {{ $labels.bay }} ({{ $labels.serial }}, {{ $labels.model }})"
                description: "Bay {{ $labels.bay }}, serial {{ $labels.serial }} (currently {{ $labels.device }}) on {{ $labels.instance }} failed its SMART overall-health check. Capture `smartctl -a /dev/{{ $labels.device }}` before replacing it, the output is the RMA evidence."
            - alert: SmartScrapeFailed
              # Distinct from a FAILED health check: the device is present but
              # smartctl could not be read at all (exit bits 0-1). Without this
              # the disk would simply stop being reported, which on a dashboard
              # is indistinguishable from healthy.
              expr: smart_scrape_ok{job="vm-node-exporter"} == 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Cannot read SMART data from bay {{ $labels.bay }} ({{ $labels.serial }})"
                description: "smartctl returned no usable output for bay {{ $labels.bay }}, serial {{ $labels.serial }} (currently {{ $labels.device }}) on {{ $labels.instance }} for 15 minutes. The device is present but unreadable, which is how a drive dropping off the SATA bus begins."
            - alert: SmartDevicesNone
              # smart_devices_total is written after the device loop whether or
              # not any disk was readable, so a total loss shows up as a real
              # zero rather than an absent series. That is strictly better than
              # comparing count() against count() an hour ago: it cannot expire
              # out from under itself, and it fires immediately instead of
              # waiting for the offset window.
              expr: smart_devices_total{job="vm-node-exporter"} == 0
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "{{ $labels.instance }} can read SMART from no disks at all"
                description: "The exporter on {{ $labels.instance }} ran but could not read a single disk. Device enumeration is failing rather than one drive being sick. Check `lsblk`, and `dmesg` for ata link errors. Bay mapping: LED diskN = ataN = Nth tray left to right, NOT sd letters."
            - alert: SmartDeviceCountDropped
              # Partial loss: some disks still readable, fewer than before. Uses
              # the exporter's counter rather than count() over the per-disk
              # series, so the comparison still has a left-hand side when every
              # disk goes away (SmartDevicesNone then carries it at critical).
              # Subtraction rather than `<` so that $value is the number of
              # disks LOST. With `a < b` Prometheus hands the annotation the
              # left-hand side, so "{{ $value }} fewer disks" would have printed
              # the current count and read as a much bigger loss than occurred.
              expr: |
                smart_devices_total{job="vm-node-exporter"} offset 1h
                  -
                smart_devices_total{job="vm-node-exporter"} > 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Fewer readable disks on {{ $labels.instance }} than an hour ago"
                description: "{{ $labels.instance }} can read SMART from {{ $value }} fewer disks than it could an hour ago, which is what a drive falling off the SATA bus looks like. Compare `lsblk` against the expected bay map and check `dmesg` for ata link errors."
            - alert: ZfsVdevErrorsIncreasing
              # ZFS's own read/write/checksum counters per disk. They reset on
              # `zpool clear`, which increase() treats as a counter reset, so a
              # clear does not fire this. The bay 3 failure on 2026-10-08 ran
              # these to read 3 / write 256 before ZFS faulted the disk.
              expr: |
                label_replace(increase(zfs_vdev_read_errors{job="vm-node-exporter"}[15m]) > 0, "kind", "read", "", "")
                or
                label_replace(increase(zfs_vdev_write_errors{job="vm-node-exporter"}[15m]) > 0, "kind", "write", "", "")
                or
                label_replace(increase(zfs_vdev_checksum_errors{job="vm-node-exporter"}[15m]) > 0, "kind", "checksum", "", "")
              for: 0m
              labels:
                severity: warning
              annotations:
                summary: "ZFS {{ $labels.kind }} errors on bay {{ $labels.bay }} ({{ $labels.serial }})"
                description: "Bay {{ $labels.bay }}, serial {{ $labels.serial }} ({{ $labels.pool }}/{{ $labels.vdev }}, currently {{ $labels.device }}) gained {{ $value | printf \"%.0f\" }} {{ $labels.kind }} errors in 15m. On the Inland IB24AK drives this precedes the drive dropping off the bus. Check `zpool status -v {{ $labels.pool }}`."
            - alert: ZfsVdevMetricsUnreadable
              # Without this, a `zpool status -j` that stops working (TrueNAS
              # update, changed JSON) would leave zero per-disk series, which
              # looks exactly like every disk being fine.
              expr: zfs_vdev_scrape_ok{job="vm-node-exporter"} == 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Per-disk ZFS state unreadable on {{ $labels.instance }}"
                description: "The exporter on {{ $labels.instance }} could not read or parse `zpool status -j -p` for 15 minutes, so ZfsVdevNotOnline is blind. Run it by hand on the NAS and check the JSON still has .pools[].vdevs."
            - alert: SmartCrcErrorsIncreasing
              # UDMA CRC errors are the classic signature of a flaky SATA link
              # or cable rather than dying flash, so this is the closest early
              # warning for the bus dropouts. All eight disks read 0 as of
              # 2026-09-27, so any increase is genuinely new.
              expr: increase(smart_crc_error_count{job="vm-node-exporter"}[6h]) > 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "SATA CRC errors increasing on bay {{ $labels.bay }} ({{ $labels.serial }})"
                description: "Bay {{ $labels.bay }}, {{ $labels.device }} ({{ $labels.model }}, serial {{ $labels.serial }}) on {{ $labels.instance }} gained {{ $value | printf \"%.0f\" }} UDMA CRC errors in 6h. This usually means the link or cable, not the flash."
            - alert: SmartReallocatedSectorsIncreasing
              expr: increase(smart_reallocated_sector_count{job="vm-node-exporter"}[24h]) > 0
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "Reallocated sectors increasing on bay {{ $labels.bay }} ({{ $labels.serial }})"
                description: "Bay {{ $labels.bay }}, {{ $labels.device }} ({{ $labels.model }}, serial {{ $labels.serial }}) on {{ $labels.instance }} gained {{ $value | printf \"%.0f\" }} reallocated sectors in 24h. Media is being retired; plan replacement."
            - alert: SmartPrefailAttributeBelowThreshold
              # smartctl exit bit 4. A prefail attribute at or below threshold
              # is the vendor saying this drive is expected to fail, which is a
              # stronger statement than a rising counter.
              expr: smart_prefail_below_threshold{job="vm-node-exporter"} == 1
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "Prefail attribute below threshold on bay {{ $labels.bay }} ({{ $labels.serial }})"
                description: "Bay {{ $labels.bay }}, {{ $labels.device }} ({{ $labels.model }}, serial {{ $labels.serial }}) on {{ $labels.instance }} has a prefail attribute at or below its threshold. Capture `smartctl -a /dev/{{ $labels.device }}` now, that output is the RMA evidence."
            - alert: SmartErrorLogHasErrors
              # smartctl exit bit 6.
              expr: smart_error_log_has_errors{job="vm-node-exporter"} == 1
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "SMART error log is not empty on bay {{ $labels.bay }} ({{ $labels.serial }})"
                description: "Bay {{ $labels.bay }}, {{ $labels.device }} ({{ $labels.model }}, serial {{ $labels.serial }}) on {{ $labels.instance }} has entries in its SMART error log. Read them with `smartctl -l error /dev/{{ $labels.device }}` before assuming the drive is fine."
            - alert: SmartMetricsAbsent
              # Every rule in this group reads one textfile. If it is deleted,
              # never recreated after a TrueNAS boot-environment update, or
              # written with no disks enumerated, then every selector here goes
              # empty. Crucially `count by (instance) (...)` and
              # `time() - <ts>` both yield NO SAMPLE rather than a zero, so the
              # whole group silently stops being able to fire and nothing pages.
              #
              # NodeDown does not cover this: node_exporter is still up and
              # serving, it simply has nothing to serve. That is the failure
              # mode this lab keeps repeating, where a green liveness check sits
              # on top of a collector that stopped producing data.
              #
              # absent() needs a fully specified selector to carry a label set,
              # hence the explicit instance. There is one NAS; a second would
              # need its own branch here, which is the price of having an
              # absence alert at all.
              #
              # Anchored on smart_device_health and the timestamp, NOT on
              # smart_devices_total, even though that gauge is the better zero
              # signal elsewhere in this group. smart_devices_total arrived with
              # ansible-quasarlab#209 and is not deployed to the NAS yet, so an
              # absent() on it would fire a false critical the moment these rules
              # land. The other rules that read the new metrics are merely inert
              # until that deploy, which is safe; an absence rule is not.
              expr: |
                absent(smart_device_health{job="vm-node-exporter", instance="truenas"})
                or
                absent(zfs_smart_textfile_last_run_timestamp_seconds{job="vm-node-exporter", instance="truenas"})
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "No pool or SMART metrics at all from {{ $labels.instance }}"
                description: "{{ $labels.instance }} is exporting no SMART disk series or no exporter timestamp, so every pool and drive-health alert in this group is blind rather than merely quiet. node_exporter being up proves nothing here. Check that /var/lib/node_exporter/textfiles/zfs_smart.prom exists and that zfs-smart-textfile.timer survived the last boot-environment update."
            - alert: ZfsSmartExporterStale
              # Every rule above reads a textfile that one timer writes. If that
              # timer dies the series go stale and then absent, and all of the
              # above quietly stop being able to fire. This is the rule that
              # keeps the rest from being vacuous.
              expr: time() - zfs_smart_textfile_last_run_timestamp_seconds{job="vm-node-exporter"} > 1800
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "ZFS/SMART exporter on {{ $labels.instance }} is stale"
                description: "The zfs-smart-textfile timer on {{ $labels.instance }} last wrote {{ $value | humanizeDuration }} ago. Until it runs again every pool and SMART alert in this group is blind. Check `systemctl status zfs-smart-textfile.timer` and that it survived a boot-environment update."
            - alert: BayLedsServiceDown
              # bay-leds.service (ansible-quasarlab roles/truenas) paints the
              # tray to pull red. If it dies the panel either pulses purple
              # (ExecStopPost) or, after a SIGKILL or a hung loop, freezes in
              # its last state, which may look healthy. The heartbeat textfile
              # is the only way to tell from outside. absent() covers the
              # service never starting, e.g. i2c-dev failing to load, or a
              # boot-environment update dropping the unit.
              expr: |
                time() - bay_leds_last_loop_timestamp_seconds{job="vm-node-exporter"} > 300
                or
                absent(bay_leds_last_loop_timestamp_seconds{job="vm-node-exporter", instance="truenas"})
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Bay LED service on {{ $labels.instance }} is not running"
                description: "The front-panel bay LEDs on {{ $labels.instance }} are not being driven, so a faulted disk will NOT light its tray red, and the panel may be frozen in a healthy-looking state. Check `systemctl status bay-leds.service` and `journalctl -u bay-leds`; `ExecStartPre` needs `modprobe i2c-dev`."
    media-service-health:
      groups:
        - name: media-services
          rules:
            - alert: MediaDeploymentUnavailable
              expr: |
                kube_deployment_status_replicas_available{namespace="media"} == 0
                and
                kube_deployment_spec_replicas{namespace="media"} > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "{{ $labels.deployment }} has been down for 5 minutes"
                description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has 0 available replicas. The service is completely offline."
            - alert: MediaPodCrashLooping
              expr: |
                increase(kube_pod_container_status_restarts_total{namespace="media"}[1h]) > 5
                and on (namespace, pod)
                kube_pod_status_phase{namespace="media", phase="Running"} == 1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.pod }} is crash-looping ({{ $value | printf \"%.0f\" }} restarts/hr)"
                description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted more than 5 times in the last hour. Check logs with: kubectl logs -n media {{ $labels.pod }} -c {{ $labels.container }} --previous"
            - alert: MediaPodNotReady
              expr: |
                min by (namespace, pod) (
                  kube_pod_status_ready{namespace="media", condition="true"}
                ) == 0
                and on (namespace, pod)
                kube_pod_status_phase{namespace="media", phase="Running"} == 1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.pod }} not ready for 10+ minutes"
                description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been running but not ready for over 10 minutes. Readiness probes may be failing."

  # Prometheus Operator
  prometheusOperator:
    enabled: true
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 200Mi
        cpu: 200m
