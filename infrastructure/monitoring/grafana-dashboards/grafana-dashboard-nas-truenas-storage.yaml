          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "smart_power_on_hours",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "__name__": true,
                  "job": true,
                  "instance": true
                },
                "renameByName": {
                  "device": "device",
                  "model": "model",
                  "serial": "serial"
                }
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Drive temperature",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 28
