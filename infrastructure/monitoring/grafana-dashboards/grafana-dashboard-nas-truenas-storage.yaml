                "uid": "${datasource}"
              },
              "expr": "smart_temperature_celsius",
              "legendFormat": "{{device}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CRC errors and reallocated sectors (should stay flat at 0)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 28
          },
          "id": 12,
          "fieldConfig": {
            "defaults": {
