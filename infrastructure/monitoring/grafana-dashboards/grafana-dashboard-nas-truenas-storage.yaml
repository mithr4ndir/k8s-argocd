            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "zfs_pool_capacity_ratio",
              "legendFormat": "{{pool}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
