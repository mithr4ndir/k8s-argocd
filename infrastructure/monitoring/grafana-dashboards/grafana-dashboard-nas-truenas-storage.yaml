              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "smart_device_health",
              "legendFormat": "{{device}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Exporter freshness",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
