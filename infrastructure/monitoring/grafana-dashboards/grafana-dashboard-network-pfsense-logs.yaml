---
# Generated by scripts/dashboard-to-configmap.py -- edit the dashboard in
# Grafana, export the JSON, and re-run this rather than hand-editing the file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-network-pfsense-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Network"
data:
  pfsense-logs.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "pfSense (core.home.arpa) syslog shipped over UDP 5514 to vector-aggregator and stored in Loki. Keep the time range short: the firewall alone emits about 50 lines a minute and every parsed panel re-reads them.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "title": "Overview",
          "type": "row"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "All pfSense syslog lines reaching Loki. About 50/min is normal; 0 means remote logging stopped.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum(rate({host=\"core.home.arpa\"} [1m])) * 60",
              "refId": "A",
              "legendFormat": "Lines / min",
              "queryType": "range"
            }
          ],
          "title": "Lines / min",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "Firewall block entries per minute (cheap line filter, no parsing).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum(rate({host=\"core.home.arpa\"} |= \"filterlog\" |= \",block,\" [1m])) * 60",
              "refId": "A",
              "legendFormat": "Blocks / min",
              "queryType": "range"
            }
          ],
          "title": "Blocks / min",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "dpinger / rc.gateway_alarm events in the selected range. Any non-zero value means a WAN went down or flapped.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum(count_over_time({host=\"core.home.arpa\"} |= \"rc.gateway_alarm\" [$__range]))",
              "refId": "A",
              "legendFormat": "Gateway alarms",
              "queryType": "range"
            }
          ],
          "title": "Gateway alarms",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "sshguard attack / block lines in the selected range. A failed API call (401) counts as an attack.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum(count_over_time({host=\"core.home.arpa\"} |= `\"appname\":\"sshguard\"` [$__range]))",
              "refId": "A",
              "legendFormat": "sshguard events",
              "queryType": "range"
            }
          ],
          "title": "sshguard events",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "Which pfSense daemons are talking. filterlog dominates by design.",
          "interval": "1m",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisLabel": "",
                "barAlignment": 0,
                "drawStyle": "bars",
                "fillOpacity": 60,
                "gradientMode": "none",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                }
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [
                "sum"
              ],
              "displayMode": "table",
              "placement": "right"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum by (appname) (count_over_time({host=\"core.home.arpa\"} | json | appname=~\"$appname\" [$__interval]))",
              "refId": "A",
              "legendFormat": "{{appname}}",
              "queryType": "range"
            }
          ],
          "title": "Log volume by daemon",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "igb0 and igb2 are the WAN links, igb1 is LAN.",
          "interval": "1m",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisLabel": "",
                "barAlignment": 0,
                "drawStyle": "bars",
                "fillOpacity": 60,
                "gradientMode": "none",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                }
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": [
                "sum"
              ],
              "displayMode": "table",
              "placement": "right"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum by (iface) (count_over_time({host=\"core.home.arpa\"} | json | appname=\"filterlog\" | line_format \"{{.message}}\" | pattern \"<_>,<_>,<_>,<rule>,<iface>,<_>,<action>,<dir>,<ipver>,<_>,<_>,<_>,<_>,<_>,<_>,<_>,<proto>,<_>,<src>,<dst>,<rest>\" | iface=~\"$iface\" | action=~\"$action\" | src=~\"$src\" [$__interval]))",
              "refId": "A",
              "legendFormat": "{{iface}}",
              "queryType": "range"
            }
          ],
          "title": "Blocks by interface",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "id": 8,
          "title": "Firewall",
          "type": "row"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "Only IPv4 TCP/UDP lines carry ports. Port 23 leading is normal internet background scanning. About 1000 distinct ports an hour, so keep the range under about 4h (max_query_series).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-BlPu"
              },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 0,
            "y": 14
          },
          "id": 9,
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "namePlacement": "left",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color",
            "minVizHeight": 16,
            "maxVizHeight": 300
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "topk(10, sum by (dport) (count_over_time({host=\"core.home.arpa\"} | json | appname=\"filterlog\" | line_format \"{{.message}}\" | pattern \"<_>,<_>,<_>,<rule>,<iface>,<_>,<action>,<dir>,<ipver>,<_>,<_>,<_>,<_>,<_>,<_>,<_>,<proto>,<_>,<src>,<dst>,<sport>,<dport>,<_>\" | ipver=\"4\" | proto=~\"tcp|udp\" | iface=~\"$iface\" | action=~\"$action\" | src=~\"$src\" | dport=~\"$dport\" [$__range])))",
              "refId": "A",
              "legendFormat": "{{dport}}",
              "queryType": "instant",
              "instant": true,
              "range": false
            }
          ],
          "title": "Top blocked destination ports (TCP/UDP)",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "Roughly 1000 distinct sources an hour hit the WAN. Loki caps a query at max_query_series series, so keep the range under about 4h or this panel errors.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-BlPu"
              },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 8,
            "y": 14
          },
          "id": 10,
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "namePlacement": "left",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color",
            "minVizHeight": 16,
            "maxVizHeight": 300
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "topk(10, sum by (src) (count_over_time({host=\"core.home.arpa\"} | json | appname=\"filterlog\" | line_format \"{{.message}}\" | pattern \"<_>,<_>,<_>,<rule>,<iface>,<_>,<action>,<dir>,<ipver>,<_>,<_>,<_>,<_>,<_>,<_>,<_>,<proto>,<_>,<src>,<dst>,<rest>\" | ipver=\"4\" | iface=~\"$iface\" | action=~\"$action\" | src=~\"$src\" [$__range])))",
              "refId": "A",
              "legendFormat": "{{src}}",
              "queryType": "instant",
              "instant": true,
              "range": false
            }
          ],
          "title": "Top blocked sources (IPv4)",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "IPv6 lines are excluded: their CSV layout puts the destination where IPv4 has the protocol.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-BlPu"
              },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 16,
            "y": 14
          },
          "id": 11,
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "namePlacement": "left",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color",
            "minVizHeight": 16,
            "maxVizHeight": 300
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum by (proto) (count_over_time({host=\"core.home.arpa\"} | json | appname=\"filterlog\" | line_format \"{{.message}}\" | pattern \"<_>,<_>,<_>,<rule>,<iface>,<_>,<action>,<dir>,<ipver>,<_>,<_>,<_>,<_>,<_>,<_>,<_>,<proto>,<_>,<src>,<dst>,<rest>\" | ipver=\"4\" | iface=~\"$iface\" | action=~\"$action\" | src=~\"$src\" [$__range]))",
              "refId": "A",
              "legendFormat": "{{proto}}",
              "queryType": "instant",
              "instant": true,
              "range": false
            }
          ],
          "title": "Blocks by protocol (IPv4)",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "Use the Interface / Source / Dest port filters above. ICMP and IPv6 blocks are in the raw panel below.",
          "gridPos": {
            "h": 14,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "id": 12,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "{host=\"core.home.arpa\"} | json | appname=\"filterlog\" | line_format \"{{.message}}\" | pattern \"<_>,<_>,<_>,<rule>,<iface>,<_>,<action>,<dir>,<ipver>,<_>,<_>,<_>,<_>,<_>,<_>,<_>,<proto>,<_>,<src>,<dst>,<sport>,<dport>,<_>\" | ipver=\"4\" | proto=~\"tcp|udp\" | iface=~\"$iface\" | action=~\"$action\" | src=~\"$src\" | dport=~\"$dport\" | line_format \"{{.action}} {{.dir}} {{.iface}} {{.proto}} {{.src}}:{{.sport}} to {{.dst}}:{{.dport}} rule {{.rule}}\"",
              "refId": "A",
              "legendFormat": "",
              "queryType": "range"
            }
          ],
          "title": "Firewall log (parsed, IPv4 TCP/UDP)",
          "type": "logs"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "id": 13,
          "title": "Daemons",
          "type": "row"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "DHCP, OpenVPN, gateway alarms, sshguard, cron, php. Filter with the Daemon selector and Search box.",
          "gridPos": {
            "h": 14,
            "w": 24,
            "x": 0,
            "y": 38
          },
          "id": 14,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "{host=\"core.home.arpa\"} | json | appname != \"filterlog\" | appname=~\"$appname\" |= `$search` | line_format \"{{.appname}}[{{.procid}}] {{.message}}\"",
              "refId": "A",
              "legendFormat": "",
              "queryType": "range"
            }
          ],
          "title": "Everything except filterlog",
          "type": "logs"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "Unparsed. Includes ICMP and IPv6 filterlog lines the parsed panel skips.",
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 52
          },
          "id": 15,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "{host=\"core.home.arpa\"} |= `$search` | json | line_format \"{{.appname}}[{{.procid}}] {{.message}}\"",
              "refId": "A",
              "legendFormat": "",
              "queryType": "range"
            }
          ],
          "title": "Raw pfSense log (all lines)",
          "type": "logs"
        }
      ],
      "schemaVersion": 39,
      "tags": [
        "logs",
        "network",
        "pfsense",
        "loki"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "Loki",
              "value": "Loki"
            },
            "hide": 0,
            "includeAll": false,
            "label": "Datasource",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "loki",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "description": "appname is a parsed field, not a Loki label, so this list is static. Pick Other and type a name for anything missing.",
            "hide": 0,
            "includeAll": true,
            "label": "Daemon",
            "multi": true,
            "name": "appname",
            "options": [],
            "query": "filterlog,dhcpd,dhclient,openvpn,dpinger,rc.gateway_alarm,sshguard,php,php-fpm,check_reload_status,syslogd,kernel,/usr/sbin/cron",
            "type": "custom"
          },
          {
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "description": "igb0 WAN, igb1 LAN, igb2 WAN2, tun_wg0 WireGuard",
            "hide": 0,
            "includeAll": true,
            "label": "Interface",
            "multi": true,
            "name": "iface",
            "options": [],
            "query": "igb0,igb1,igb2,tun_wg0",
            "type": "custom"
          },
          {
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "description": "Only block rules log by default.",
            "hide": 0,
            "includeAll": true,
            "label": "Action",
            "multi": true,
            "name": "action",
            "options": [],
            "query": "block,pass",
            "type": "custom"
          },
          {
            "current": {
              "text": ".*",
              "value": ".*"
            },
            "description": "e.g. 192.168.3.2 for the WireGuard laptop, or ^192\\.168\\. for LAN only",
            "hide": 0,
            "label": "Source IP (regex)",
            "name": "src",
            "options": [
              {
                "selected": true,
                "text": ".*",
                "value": ".*"
              }
            ],
            "query": ".*",
            "type": "textbox"
          },
          {
            "current": {
              "text": ".*",
              "value": ".*"
            },
            "description": "e.g. 22 or (22|443)",
            "hide": 0,
            "label": "Dest port (regex)",
            "name": "dport",
            "options": [
              {
                "selected": true,
                "text": ".*",
                "value": ".*"
              }
            ],
            "query": ".*",
            "type": "textbox"
          },
          {
            "current": {
              "text": "",
              "value": ""
            },
            "description": "Substring match on the raw line",
