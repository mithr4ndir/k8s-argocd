# promtool unit tests for the memory-sync alerts. Label sets mirror the live
# series on 2026-10-09: instance="command-center1", job="vm-node-exporter".
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: a sync that stops succeeding warns after 14h, and a healthy one does not
    input_series:
      # Succeeds at t=0 and never again; the job keeps running (last_run moves).
      - series: 'memory_sync_last_success_timestamp_seconds{job="vm-node-exporter", instance="command-center1"}'
        values: '0+0x1000'
      - series: 'memory_sync_last_run_timestamp_seconds{job="vm-node-exporter", instance="command-center1"}'
        values: '0+60x1000'
    alert_rule_test:
      - eval_time: 13h
        alertname: MemorySyncStale
        exp_alerts: []
      - eval_time: 15h
        alertname: MemorySyncStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: vm-node-exporter
              instance: command-center1
            exp_annotations:
              summary: "Agent memory has not synced to claude-config for over 14h"
              description: "memory-sync on command-center1 has not completed a sync in over 14 hours, so new agent memory exists only on that disk. Check `systemctl --user status memory-sync.timer memory-sync.service` and `journalctl --user -u memory-sync` as ladino."

  - interval: 1m
    name: no heartbeat at all warns
    input_series:
      - series: 'up{job="vm-node-exporter", instance="command-center1"}'
        values: '1x90'
    alert_rule_test:
      - eval_time: 60m
        alertname: MemorySyncStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: vm-node-exporter
              instance: command-center1
            exp_annotations:
              summary: "Agent memory has not synced to claude-config for over 14h"
              description: "memory-sync on command-center1 has not completed a sync in over 14 hours, so new agent memory exists only on that disk. Check `systemctl --user status memory-sync.timer memory-sync.service` and `journalctl --user -u memory-sync` as ladino."

  - interval: 1m
    name: a blocked push warns, and an unblocked run does not
    input_series:
      - series: 'memory_sync_blocked{job="vm-node-exporter", instance="command-center1"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: MemorySyncBlocked
        exp_alerts: []
      - eval_time: 20m
        alertname: MemorySyncBlocked
        exp_alerts:
          - exp_labels:
              severity: warning
              job: vm-node-exporter
              instance: command-center1
            exp_annotations:
              summary: "Memory sync refused to push: possible secret in agent memory"
              description: "The gitleaks scan in memory-sync on command-center1 found something in claude-config/memory, or docker was unavailable, so nothing was pushed. Inspect without printing values: `docker run --rm -v ~/code/claude-config/memory:/scan:ro ghcr.io/gitleaks/gitleaks:v8.21.2 dir /scan --redact`. Remove the value from memory and assess rotation separately."
