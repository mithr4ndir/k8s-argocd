# promtool unit tests for the loki-alerts group. Shapes follow the
# 2026-10-15 outage (#237): loki-0 not ready for about 5 minutes, push 500s
# while Vector normally pushes about 170 times a minute, and the working set
# pinned at the memory limit.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: loki not ready for 3m is critical, a one-minute restart blip is not
    input_series:
      - series: 'kube_statefulset_replicas{job="kube-state-metrics", namespace="monitoring", statefulset="loki"}'
        values: '1x40'
      # Ready, a one-minute blip at 5m, ready again, then down from 20m.
      - series: 'kube_statefulset_status_replicas_ready{job="kube-state-metrics", namespace="monitoring", statefulset="loki"}'
        values: '1x4 0 1x14 0x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: LokiNotReady
        exp_alerts: []
      - eval_time: 22m
        alertname: LokiNotReady
        exp_alerts: []
      - eval_time: 24m
        alertname: LokiNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              job: kube-state-metrics
              namespace: monitoring
              statefulset: loki
            exp_annotations:
              summary: "Loki is not ready, logs are not being ingested"
              description: "0 of the Loki StatefulSet replicas are ready. Loki's ingester runs in the same pod, so pushes from Vector are failing and those logs are being lost. Check `kubectl -n monitoring describe pod loki-0` and `kubectl -n monitoring top pod loki-0`; a runaway query pins memory at the limit."

  - interval: 1m
    name: sustained push 5xx is critical, a stray 500 is not
    input_series:
      - series: 'loki_request_duration_seconds_count{namespace="monitoring", job="monitoring/loki", method="POST", route="loki_api_v1_push", status_code="204", ws="false"}'
        values: '0+170x40'
      # One 500 at 5m, then 12 a minute from 20m.
      - series: 'loki_request_duration_seconds_count{namespace="monitoring", job="monitoring/loki", method="POST", route="loki_api_v1_push", status_code="500", ws="false"}'
        values: '0x4 1x15 1+12x20'
      # Query traffic errors must not count toward the push ratio.
      - series: 'loki_request_duration_seconds_count{namespace="monitoring", job="monitoring/loki", method="GET", route="loki_api_v1_query_range", status_code="500", ws="false"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: LokiPushErrors
        exp_alerts: []
      - eval_time: 22m
        alertname: LokiPushErrors
        exp_alerts: []
      - eval_time: 30m
        alertname: LokiPushErrors
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Loki is rejecting 6.593% of log pushes"
              description: "More than 5% of POST /loki/api/v1/push requests have returned 5xx for 3 minutes. Vector drops what it cannot push, so logs from this period are being lost. Check `kubectl -n monitoring logs loki-0 -c loki --since=10m | grep push` and whether loki-0 is at its memory limit."

  - interval: 1m
    name: working set above 90% of the limit warns, normal load does not
    input_series:
      - series: 'kube_pod_container_resource_limits{job="kube-state-metrics", namespace="monitoring", pod="loki-0", container="loki", resource="memory", unit="byte"}'
        values: '2147483648x40'
      # 0.85GiB (normal is about 0.45GiB), then 1.9GiB from 20m.
      - series: 'container_memory_working_set_bytes{job="kubelet", namespace="monitoring", pod="loki-0", container="loki"}'
        values: '912680550x19 2040109465x20'
      # The sidecar in the same pod is not Loki.
      - series: 'container_memory_working_set_bytes{job="kubelet", namespace="monitoring", pod="loki-0", container="loki-sc-rules"}'
        values: '2040109465x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: LokiMemoryNearLimit
        exp_alerts: []
      - eval_time: 21m
        alertname: LokiMemoryNearLimit
        exp_alerts: []
      - eval_time: 25m
        alertname: LokiMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              pod: loki-0
            exp_annotations:
              summary: "loki-0 is at 95% of its memory limit"
              description: "Loki's working set has been above 90% of its memory limit for 3 minutes. Usually a broad query; Loki stops ingesting if it stays there. Check running queries with `kubectl -n monitoring logs loki-0 -c loki --since=10m | grep 'metrics.go'` and narrow or cancel them."
