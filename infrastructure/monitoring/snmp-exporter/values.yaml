prometheus-snmp-exporter:
  replicas: 1

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

  service:
    type: ClusterIP
    port: 9116

  serviceMonitor:
    enabled: false

  extraArgs:
    - --config.file=/etc/snmp_exporter/snmp.yml

  extraSecretMounts:
    - name: snmp-exporter-config
      mountPath: /etc/snmp_exporter/snmp.yml
      subPath: snmp.yml
      secretName: snmp-exporter-config
      readOnly: true
      defaultMode: 420

  podAnnotations:
    reloader.stakater.com/auto: "true"
