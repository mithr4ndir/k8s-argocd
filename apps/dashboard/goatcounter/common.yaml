---
# Source: app-template/templates/common.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goatcounter
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: goatcounter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: goatcounter
    helm.sh/chart: app-template-3.5.1
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: main
      app.kubernetes.io/name: goatcounter
      app.kubernetes.io/instance: goatcounter
  template:
    metadata:
      labels: 
        app.kubernetes.io/component: main
        app.kubernetes.io/instance: goatcounter
        app.kubernetes.io/name: goatcounter
    spec: 
      enableServiceLinks: false
      serviceAccountName: default
      automountServiceAccountToken: true
      securityContext: 
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers: 
        - args:
          - serve
          - -listen=:8080
          - -tls=none
          - -db=sqlite+/home/user/.local/share/goatcounter/db/goatcounter.sqlite3
          - -automigrate
          command:
          - goatcounter
          env:
          - name: TZ
            value: America/Los_Angeles
          image: arp242/goatcounter:2.7.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 5
            periodSeconds: 30
            tcpSocket:
              port: 8080
          name: main
          ports:
          - containerPort: 8080
            name: http
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /status
              port: 8080
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          startupProbe:
            failureThreshold: 60
            initialDelaySeconds: 5
            periodSeconds: 5
            tcpSocket:
              port: 8080
          volumeMounts:
          - mountPath: /home/user/.local/share/goatcounter
            name: data
      volumes: 
        - name: data
          persistentVolumeClaim:
            claimName: goatcounter-data
