# Lab scout (Radagast) secrets. Source: https://github.com/mithr4ndir/lab-scout
#   LAB_SCOUT_WEBHOOK_URL    "Discord Lab Scout Webhook" item, webhook named
#                            Magic in the lab ideas channel. Never reuse
#                            another consumer's webhook item.
#   CLAUDE_CODE_OAUTH_TOKEN  "Claude Code OAuth Token (lab-scout)", a
#                            subscription token from `claude setup-token`.
# After changing either item, force a sync: this refreshes only every 24h.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lab-scout-secrets
  namespace: automation
  labels:
    app.kubernetes.io/name: lab-scout
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infrastructure
  target:
    name: lab-scout-secrets
    creationPolicy: Owner
  data:
  - secretKey: LAB_SCOUT_WEBHOOK_URL
    remoteRef:
      key: 7vywuwxnj7jcpur7m552eiirz4/webhook_url
  - secretKey: CLAUDE_CODE_OAUTH_TOKEN
    remoteRef:
      key: xmc64qxjifvpcglmfvh57njlue/credential
