# Weekly outings digest secrets. Source: https://github.com/mithr4ndir/outings
#   OUTINGS_WEBHOOK_URL      "Discord Outings Webhook" item. Its own webhook;
#                            never reuse another consumer's item.
#   CLAUDE_CODE_OAUTH_TOKEN  "Claude Code OAuth Token (outings)", a
#                            subscription token from `claude setup-token`.
# After changing either item, force a sync: this refreshes only every 24h.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outings-secrets
  namespace: automation
  labels:
    app.kubernetes.io/name: outings
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infrastructure
  target:
    name: outings-secrets
    creationPolicy: Owner
  data:
  # TODO(before merge): replace both item ids with the new 1Password items.
  - secretKey: OUTINGS_WEBHOOK_URL
    remoteRef:
      key: REPLACE_WITH_OUTINGS_WEBHOOK_ITEM_ID/webhook_url
  - secretKey: CLAUDE_CODE_OAUTH_TOKEN
    remoteRef:
      key: REPLACE_WITH_OUTINGS_OAUTH_ITEM_ID/credential
