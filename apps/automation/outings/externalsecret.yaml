# Weekly outings digest secrets. Source: https://github.com/mithr4ndir/outings
#   OUTINGS_WEBHOOK_URL      "Discord Outings Webhook" item, webhook named
#                            Adventure Bot (channel 1557388075892609104). Its own webhook;
#                            never reuse another consumer's item.
#   CLAUDE_CODE_OAUTH_TOKEN  "Claude Code OAuth Token (lab-scout)", the
#                            subscription token from `claude setup-token`.
#                            Shared with lab-scout on purpose (Chris, 2026-10-07):
#                            rotating it updates both jobs.
# After changing either item, force a sync: this refreshes only every 24h.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outings-secrets
  namespace: automation
  labels:
    app.kubernetes.io/name: outings
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infrastructure
  target:
    name: outings-secrets
    creationPolicy: Owner
  data:
  - secretKey: OUTINGS_WEBHOOK_URL
    remoteRef:
      key: pkq3zrzjgjmhzd2sfgeimm5yem/webhook_url
  - secretKey: CLAUDE_CODE_OAUTH_TOKEN
    remoteRef:
      key: xmc64qxjifvpcglmfvh57njlue/credential
