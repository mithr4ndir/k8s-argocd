apiVersion: batch/v1
kind: CronJob
metadata:
  name: donchian-signal-donchian-signal
  namespace: automation
  labels:
    app.kubernetes.io/name: donchian-signal
    app.kubernetes.io/instance: donchian-signal
    app.kubernetes.io/version: 0.1.4
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: signal-generator
spec:
  schedule: 5 16 * * MON-FRI
  timeZone: America/New_York
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # Age out finished Jobs after 7 days. failedJobsHistoryLimit caps how MANY
      # failed Jobs are kept, not how long, so a small number of failures sits in
      # the API server forever and keeps KubeJobFailed firing on ancient history.
      # Two dream-team Jobs from 46 and 17 days ago were still alerting this way.
      ttlSecondsAfterFinished: 604800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: donchian-signal
            app.kubernetes.io/instance: donchian-signal
            app.kubernetes.io/version: 0.1.4
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/component: signal-generator
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: signal
            image: ghcr.io/mithr4ndir/palantir-nq:0.1.4
            imagePullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            args:
            - -m
            - nq_ibb.forward.cronjob_entrypoint
            envFrom:
            - secretRef:
                name: donchian-signal-donchian-signal-secrets
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 256Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir: {}
