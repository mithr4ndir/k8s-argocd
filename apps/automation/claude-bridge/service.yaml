---
# LoadBalancer (not ClusterIP) because POST /notify is called from
# outside the cluster (operator workstations + future remote agents).
# MetalLB hands out 192.168.1.235 via L2 advertisement; pool range is
# 192.168.1.225-240 (see infrastructure/metallb/values.yaml).
#
# Operator hooks should use http://192.168.1.235:8080 (or a DNS record
# pointing at this IP) for CLAUDE_BRIDGE_URL after deploy.
apiVersion: v1
kind: Service
metadata:
  name: claude-bridge
  namespace: automation
  labels:
    app: claude-bridge
    app.kubernetes.io/name: claude-bridge
    app.kubernetes.io/component: hitl-bridge
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.235
spec:
  type: LoadBalancer
  # externalTrafficPolicy: Cluster lets any node announce the LB IP via
  # MetalLB L2 (only k8cluster1's speaker is consistently elected leader
  # in this homelab; speakers on k8cluster2 and k8cluster3 currently
  # crash-loop). Trade-off: client source IP is SNAT'd to the node's IP
  # in the audit log. The bridge's auth model is X-API-Key on POST
  # /notify, not IP-based, so source-IP preservation is nice-to-have
  # rather than required.
  externalTrafficPolicy: Cluster
  selector:
    app: claude-bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
