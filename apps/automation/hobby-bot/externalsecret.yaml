# hobby-bot secrets. Source: https://github.com/mithr4ndir/hobby-bot
#   token        "Discord Hobby Bot Token" item, the bot token from the Discord
#                Developer Portal (Bot tab). Its own item. The item starts as
#                REPLACE_ME; until the real token lands the bot runs in
#                webhook-only mode (weekly feed, no slash commands).
#   webhook_url  "Discord Outings Webhook" item, the Adventure Bot webhook in the
#                touching grass channel. Shared with outings on purpose
#                (Chris, 2026-11-09): the picks belong in that channel, and
#                rotating that webhook updates both consumers. Posts are
#                attributed to "Hobby Bot" via username override.
# After changing the item, force a sync: this refreshes only every 24h.
#   kubectl -n automation annotate externalsecret hobby-bot-secrets force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hobby-bot-secrets
  namespace: automation
  labels:
    app.kubernetes.io/name: hobby-bot
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infrastructure
  target:
    name: hobby-bot-secrets
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: os5pkmpqcynjay5hzgg2rdpmru/credential
  - secretKey: webhook_url
    remoteRef:
      key: pkq3zrzjgjmhzd2sfgeimm5yem/webhook_url
